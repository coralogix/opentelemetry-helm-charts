apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "obi.fullname" . }}
  namespace: {{ include "obi.namespace" .}}
  labels:
    {{- include "obi.labels" . | nindent 4 }}
    app.kubernetes.io/component: workload
  {{- with .Values.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "obi.selectorLabels" . | nindent 6 }}
  {{- with .Values.updateStrategy }}
  updateStrategy:
    {{- toYaml . | trim | nindent 4 }}
  {{- end }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with (include "obi.podAnnotations" .) }}
        {{- . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "obi.labels" . | nindent 8 }}
        app.kubernetes.io/component: workload
    spec:
     {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ include "obi.serviceAccountName" . }}
     {{- end }}
      {{- $networkEnabled := or (eq .Values.preset "network") .Values.config.data.network }}
      {{- $contextPropagationEnabled := .Values.contextPropagation.enabled }}
      {{- if eq .Values.preset "application" }}
      hostPID: true
      {{- end }}
      {{- if or $networkEnabled $contextPropagationEnabled }}
      hostNetwork: true
      dnsPolicy: {{ .Values.dnsPolicy }}
      {{- end }}
      {{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName }}
      {{- end }}
      initContainers:
        {{- if .Values.initContainers }}
        {{- toYaml .Values.initContainers | nindent 8 }}
        {{- end }}
      containers:
        - name: ebpf-instrument
          image: {{ .Values.global.image.registry | default .Values.image.registry }}/{{ .Values.image.repository }}{{ include "obi.imageId" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
          {{- if .Values.privileged }}
          {{- with .Values.securityContext }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- else }}
            runAsUser: 0
            readOnlyRootFilesystem: true
            capabilities:
              add:
                - BPF
                - SYS_PTRACE
                - NET_RAW
                - CHECKPOINT_RESTORE
                - DAC_READ_SEARCH
                - PERFMON
              {{- if or $networkEnabled $contextPropagationEnabled }}
                - NET_ADMIN
              {{- end }}
              {{- with .Values.extraCapabilities }}
                {{- toYaml . | nindent 16 }}
              {{- end }}
              drop:
                - ALL
          {{- end }}
          {{- $promExport := dict }}
          {{- if include "obi.prometheusExportEnabled" . }}
          {{- $promExport = ((.Values.config.data).prometheus_export) | default dict }}
          {{- end }}
          {{- $metricsPort := int (.Values.service.targetPort | default ($promExport).port | default 0) }}
          {{- $internalMetricsPort := int (.Values.service.internalMetrics.targetPort | default ((.Values.config.data.internal_metrics).prometheus).port | default 0) }}
          ports:
          {{- if $metricsPort }}
          - name: {{ .Values.service.portName }}
            containerPort: {{ $metricsPort }}
            protocol: TCP
          {{- end }}
          {{- if and $internalMetricsPort (ne $internalMetricsPort $metricsPort) }}
          - name: {{ .Values.service.internalMetrics.portName }}
            containerPort: {{ $internalMetricsPort }}
            protocol: TCP
          {{- end }}
          {{- if .Values.config.data.profile_port }}
          - name: profile
            containerPort: {{ .Values.config.data.profile_port }}
            protocol: TCP
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: OTEL_EBPF_CONFIG_PATH
              value: "/etc/ebpf-instrument/config/ebpf-instrument-config.yml"
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: status.hostIP
          {{- if .Values.k8sCache.replicas }}
            - name: OTEL_EBPF_KUBE_META_CACHE_ADDRESS
              value: {{ .Values.k8sCache.service.name }}:{{ .Values.k8sCache.service.port }}
          {{- end }}
          {{- if .Values.contextPropagation.enabled }}
            - name: OTEL_EBPF_BPF_CONTEXT_PROPAGATION
              value: {{ .Values.contextPropagation.mode | default "all" | quote }}
          {{- end }}
          {{- range $key, $value := .Values.envValueFrom }}
            - name: {{ $key | quote }}
              valueFrom:
          {{- tpl (toYaml $value) $ | nindent 16 }}
          {{- end }}
          {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: "{{ $value }}"
          {{- end }}
          volumeMounts:
            - mountPath: /etc/ebpf-instrument/config
              name: ebpf-instrument-config
          {{- if or $networkEnabled $contextPropagationEnabled }}
            - mountPath: /sys/fs/cgroup
              name: cgroup
          {{- end }}
          {{- if or $contextPropagationEnabled .Values.stats.enabled }}
            - mountPath: /sys/kernel/tracing
              name: tracefs
              readOnly: true
          {{- end }}
          {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- if or .Values.global.image.pullSecrets .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- if .Values.global.image.pullSecrets }}
        {{- toYaml .Values.global.image.pullSecrets | nindent 8 }}
        {{- else }}
        {{- toYaml .Values.image.pullSecrets | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- tpl (toYaml .) $ | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: ebpf-instrument-config
          configMap:
            name: {{ default (include "obi.fullname" .) .Values.config.name }}
      {{- if or $networkEnabled $contextPropagationEnabled }}
        - name: cgroup
          hostPath:
            path: /sys/fs/cgroup
            type: Directory
      {{- end }}
      {{- if or $contextPropagationEnabled .Values.stats.enabled }}
        - name: tracefs
          hostPath:
            path: /sys/kernel/tracing
            type: Directory
      {{- end }}
      {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
