{{- if not .Values.config.skipConfigMapCheck }}
{{- if and (not .Values.config.create) (eq .Values.config.name "") }}
  {{- fail "if .Values.config.name is not set, then .Values.config.create should be set to true to use default configuration" }}
{{- end }}
{{- end }}
{{- if and (.Values.config.create) (eq .Values.config.name "") }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "obi.fullname" . }}
  namespace: {{ include "obi.namespace" . }}
  labels:
    {{- include "obi.labels" . | nindent 4 }}
    app.kubernetes.io/component: config
  {{- with .Values.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  ebpf-instrument-config.yml: |
  {{- $configData := deepCopy .Values.config.data }}
  {{- if not (include "obi.prometheusExportEnabled" .) }}
    {{- $_ := unset $configData "prometheus_export" }}
  {{- end }}
  {{- if eq .Values.preset "network" }}
    {{- if not $configData.network }}
      {{- $_ := set $configData "network" (dict "enable" true) }}
    {{- end }}
  {{- end }}
  {{- if eq .Values.preset "application" }}
    {{- if not $configData.discovery }}
      {{- $_ := set $configData "discovery" (dict
        "instrument" (list (dict "k8s_namespace" "*"))
        "exclude_instrument" (list (dict "exe_path" "*ebpf-instrument*") (dict "exe_path" "*otelcol*"))) }}
    {{- end }}
  {{- end }}
  {{- $annotationFilter := .Values.presets.annotationFilter }}
  {{- if $annotationFilter.enabled }}
    {{- if ne .Values.preset "application" }}
      {{- fail "presets.annotationFilter requires preset to be \"application\"" }}
    {{- end }}
    {{- if not (has $annotationFilter.mode (list "include" "exclude")) }}
      {{- fail (printf "presets.annotationFilter.mode must be \"include\" or \"exclude\", got %q" $annotationFilter.mode) }}
    {{- end }}
    {{- $filterAnnotations := $annotationFilter.annotations }}
    {{- if empty $filterAnnotations }}
      {{- $filterAnnotations = dict "obi.coralogix.com/enabled" (ternary "true" "false" (eq $annotationFilter.mode "include")) }}
    {{- end }}
    {{- $discovery := $configData.discovery }}
    {{- if eq $annotationFilter.mode "include" }}
      {{- $instrument := list }}
      {{- range $selector := ($discovery.instrument | default (list (dict "k8s_namespace" "*"))) }}
        {{- $selector = deepCopy $selector }}
        {{- $selectorAnnotations := (index $selector "k8s_pod_annotations") | default dict }}
        {{- $_ := set $selector "k8s_pod_annotations" (merge (deepCopy $selectorAnnotations) $filterAnnotations) }}
        {{- $instrument = append $instrument $selector }}
      {{- end }}
      {{- $_ := set $discovery "instrument" $instrument }}
    {{- else }}
      {{- $excludeInstrument := $discovery.exclude_instrument | default list }}
      {{- range $key, $value := $filterAnnotations }}
        {{- $excludeInstrument = append $excludeInstrument (dict "k8s_pod_annotations" (dict $key $value)) }}
      {{- end }}
      {{- $_ := set $discovery "exclude_instrument" $excludeInstrument }}
    {{- end }}
    {{- $_ := set $configData "discovery" $discovery }}
  {{- end }}
  {{- if or .Values.runtimeMetrics.go.enabled .Values.runtimeMetrics.jvm.enabled .Values.stats.enabled }}
    {{- if not (hasKey $configData "otel_metrics_export") }}
      {{- $_ := set $configData "otel_metrics_export" dict }}
    {{- end }}
    {{- $otelMetricsExport := index $configData "otel_metrics_export" }}
    {{- $features := index $otelMetricsExport "features" | default list }}
    {{- if and (or .Values.runtimeMetrics.go.enabled .Values.runtimeMetrics.jvm.enabled) (not (has "application_runtime" $features)) }}{{ $features = append $features "application_runtime" }}{{- end }}
    {{- if and .Values.stats.enabled (not (has "stats" $features)) }}{{ $features = append $features "stats" }}{{- end }}
    {{- $_ := set $otelMetricsExport "features" $features }}
  {{- end }}
  {{- if .Values.runtimeMetrics.jvm.enabled }}
    {{- if not (hasKey $configData "jvm_runtime_metrics") }}
      {{- $_ := set $configData "jvm_runtime_metrics" (dict "enabled" true "sampling_interval" .Values.runtimeMetrics.jvm.samplingInterval) }}
    {{- end }}
  {{- end }}
  {{- toYaml $configData | nindent 4}}
{{- end }}
