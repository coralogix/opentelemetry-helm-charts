{{- if not .Values.config.skipConfigMapCheck }}
{{- if and (not .Values.config.create) (eq .Values.config.name "") }}
  {{- fail "if .Values.config.name is not set, then .Values.config.create should be set to true to use default configuration" }}
{{- end }}
{{- end }}
{{- if and (.Values.config.create) (eq .Values.config.name "") }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "obi.fullname" . }}
  namespace: {{ include "obi.namespace" . }}
  labels:
    {{- include "obi.labels" . | nindent 4 }}
    app.kubernetes.io/component: config
  {{- with .Values.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  ebpf-instrument-config.yml: |
  {{- $configData := deepCopy .Values.config.data }}
  {{- if not (include "obi.prometheusExportEnabled" .) }}
    {{- $_ := unset $configData "prometheus_export" }}
  {{- end }}
  {{- if eq .Values.preset "network" }}
    {{- if not $configData.network }}
      {{- $_ := set $configData "network" (dict "enable" true) }}
    {{- end }}
  {{- end }}
  {{- if eq .Values.preset "application" }}
    {{- if not $configData.discovery }}
      {{- $_ := set $configData "discovery" (dict
        "instrument" (list (dict "k8s_namespace" "*"))
        "exclude_instrument" (list (dict "exe_path" "*ebpf-instrument*") (dict "exe_path" "*otelcol*"))) }}
    {{- end }}
  {{- end }}
  {{- $annotationFilter := .Values.presets.annotationFilter }}
  {{- if $annotationFilter.enabled }}
    {{- if ne .Values.preset "application" }}
      {{- fail "presets.annotationFilter requires preset to be \"application\"" }}
    {{- end }}
    {{- if not (has $annotationFilter.mode (list "include" "exclude")) }}
      {{- fail (printf "presets.annotationFilter.mode must be \"include\" or \"exclude\", got %q" $annotationFilter.mode) }}
    {{- end }}
    {{- $filterAnnotations := $annotationFilter.annotations }}
    {{- if empty $filterAnnotations }}
      {{- $filterAnnotations = dict "obi.coralogix.com/enabled" (ternary "true" "false" (eq $annotationFilter.mode "include")) }}
    {{- end }}
    {{- $discovery := $configData.discovery }}
    {{- if eq $annotationFilter.mode "include" }}
      {{- $instrument := list }}
      {{- range $selector := ($discovery.instrument | default (list (dict "k8s_namespace" "*"))) }}
        {{- $selector = deepCopy $selector }}
        {{- $selectorAnnotations := (index $selector "k8s_pod_annotations") | default dict }}
        {{- $_ := set $selector "k8s_pod_annotations" (merge (deepCopy $selectorAnnotations) $filterAnnotations) }}
        {{- $instrument = append $instrument $selector }}
      {{- end }}
      {{- $_ := set $discovery "instrument" $instrument }}
    {{- else }}
      {{- $excludeInstrument := $discovery.exclude_instrument | default list }}
      {{- range $key, $value := $filterAnnotations }}
        {{- $excludeInstrument = append $excludeInstrument (dict "k8s_pod_annotations" (dict $key $value)) }}
      {{- end }}
      {{- $_ := set $discovery "exclude_instrument" $excludeInstrument }}
    {{- end }}
    {{- $_ := set $configData "discovery" $discovery }}
  {{- end }}
  {{- $logEnricher := .Values.presets.logEnricher }}
  {{- if $logEnricher.enabled }}
    {{- if ne .Values.preset "application" }}
      {{- fail "presets.logEnricher requires preset to be \"application\"" }}
    {{- end }}
    {{- $instrument := ($configData.discovery | default dict).instrument | default list }}
    {{- if not $instrument }}
      {{- fail "presets.logEnricher requires config.data.discovery.instrument to select the workloads to enrich" }}
    {{- end }}
    {{- $ebpf := $configData.ebpf | default dict }}
    {{- $logEnricherConfig := (index $ebpf "log_enricher") | default dict }}
    {{- if not (hasKey $logEnricherConfig "services") }}
      {{- $_ := set $logEnricherConfig "services" (list (dict "service" $instrument)) }}
    {{- end }}
    {{- if not $logEnricher.plainText.enabled }}
      {{- $plainText := deepCopy ((index $logEnricherConfig "plain_text") | default dict) }}
      {{- $_ := set $plainText "enabled" false }}
      {{- $_ := set $logEnricherConfig "plain_text" $plainText }}
    {{- end }}
    {{- $_ := set $ebpf "log_enricher" $logEnricherConfig }}
    {{- $_ := set $configData "ebpf" $ebpf }}
  {{- end }}
  {{- $metricsFeatures := .Values.metrics.features }}
  {{- $featuresSet := not (kindIs "invalid" $metricsFeatures) }}
  {{- if and $featuresSet (not (kindIs "slice" $metricsFeatures)) }}
    {{- fail "metrics.features must be a list of OBI metric feature names ([] disables all application metrics)" }}
  {{- end }}
  {{- /* OBI's modern key is the top-level metrics.features (applies to every metrics exporter);
         the per-exporter otel_metrics_export.features is deprecated but overrides the modern key
         in OBI when present, so the base list and the write target follow that precedence, and an
         explicit metrics.features value drops the deprecated key from the passthrough. */ -}}
  {{- $deprecatedExport := $configData.otel_metrics_export | default dict }}
  {{- $modernMetrics := $configData.metrics | default dict }}
  {{- $globalFeatures := list "application" }}
  {{- $useModernFeaturesKey := false }}
  {{- if hasKey $deprecatedExport "features" }}
    {{- /* "default" swallows an explicit [] here, treating it as unset — kept for backwards
           compatibility with how this passthrough always behaved; metrics.features is the
           supported way to get an empty feature list */ -}}
    {{- $globalFeatures = (index $deprecatedExport "features") | default (list "application") }}
  {{- else if hasKey $modernMetrics "features" }}
    {{- $globalFeatures = deepCopy (index $modernMetrics "features") }}
    {{- $useModernFeaturesKey = true }}
  {{- end }}
  {{- if $featuresSet }}
    {{- /* deepCopy also keeps an explicit [] as an empty base, which "default" would swallow */ -}}
    {{- $globalFeatures = deepCopy $metricsFeatures }}
    {{- $useModernFeaturesKey = true }}
    {{- if hasKey $deprecatedExport "features" }}
      {{- $_ := unset $deprecatedExport "features" }}
    {{- end }}
  {{- end }}
  {{- $writeGlobalFeatures := $featuresSet }}
  {{- if .Values.stats.enabled }}
    {{- if not (has "stats" $globalFeatures) }}
      {{- $globalFeatures = append $globalFeatures "stats" }}
    {{- end }}
    {{- $writeGlobalFeatures = true }}
  {{- end }}
  {{- $runtimeMetrics := .Values.presets.runtimeMetrics }}
  {{- if and $runtimeMetrics.enabled (eq .Values.preset "application") }}
    {{- $languages := $runtimeMetrics.languages | default list }}
    {{- $knownLanguages := list "go" "java" "dotnet" "python" "ruby" "nodejs" "rust" "php" "cpp" "generic" }}
    {{- range $language := $languages }}
      {{- if not (has $language $knownLanguages) }}
        {{- fail (printf "presets.runtimeMetrics.languages: unknown language %v, expected one of %s" $language (join ", " $knownLanguages)) }}
      {{- end }}
    {{- end }}
    {{- $jvmSelected := or (empty $languages) (has "java" $languages) }}
    {{- if empty $languages }}
      {{- if not (has "application_runtime" $globalFeatures) }}
        {{- $globalFeatures = append $globalFeatures "application_runtime" }}
      {{- end }}
      {{- $writeGlobalFeatures = true }}
    {{- else }}
      {{- $languageGlob := first $languages }}
      {{- if gt (len $languages) 1 }}
        {{- $languageGlob = printf "{%s}" (join "," $languages) }}
      {{- end }}
      {{- $discovery := $configData.discovery | default dict }}
      {{- $instrument := $discovery.instrument | default list }}
      {{- $languageSelectors := list }}
      {{- range $selector := $instrument }}
        {{- if not (hasKey $selector "languages") }}
          {{- $languageSelector := deepCopy $selector }}
          {{- $_ := set $languageSelector "languages" $languageGlob }}
          {{- $metrics := deepCopy ((index $languageSelector "metrics") | default dict) }}
          {{- $features := (index $metrics "features") | default (deepCopy $globalFeatures) }}
          {{- if not (has "application_runtime" $features) }}
            {{- $features = append $features "application_runtime" }}
          {{- end }}
          {{- $_ := set $metrics "features" $features }}
          {{- $_ := set $languageSelector "metrics" $metrics }}
          {{- $languageSelectors = append $languageSelectors $languageSelector }}
        {{- end }}
      {{- end }}
      {{- if $languageSelectors }}
        {{- $_ := set $discovery "instrument" (concat $instrument $languageSelectors) }}
        {{- $_ := set $configData "discovery" $discovery }}
      {{- else }}
        {{- $jvmSelected = false }}
      {{- end }}
    {{- end }}
    {{- if and $jvmSelected (not (hasKey $configData "jvm_runtime_metrics")) }}
      {{- $_ := set $configData "jvm_runtime_metrics" (dict "sampling_interval" $runtimeMetrics.jvm.samplingInterval) }}
    {{- end }}
  {{- end }}
  {{- if $writeGlobalFeatures }}
    {{- if $useModernFeaturesKey }}
      {{- $_ := set $modernMetrics "features" $globalFeatures }}
      {{- $_ := set $configData "metrics" $modernMetrics }}
    {{- else }}
      {{- if not (hasKey $configData "otel_metrics_export") }}
        {{- $_ := set $configData "otel_metrics_export" dict }}
      {{- end }}
      {{- $_ := set (index $configData "otel_metrics_export") "features" $globalFeatures }}
    {{- end }}
  {{- end }}
  {{- toYaml $configData | nindent 4}}
{{- end }}
