# Disables all OBI application metrics, keeping traces only. Recommended when the
# collector's `presets.spanMetrics` is enabled, since the spanmetrics connector already
# derives RED metrics from the OBI traces. `presets.runtimeMetrics` is disabled too so the
# rendered config carries a literal `features: []`; leave it enabled to keep the (not
# duplicated) runtime metrics, rendering `features: [application_runtime]` instead.
metrics:
  features: []

presets:
  runtimeMetrics:
    enabled: false
