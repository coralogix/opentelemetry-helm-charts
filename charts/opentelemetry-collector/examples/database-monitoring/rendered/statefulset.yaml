---
# Source: opentelemetry-collector/templates/statefulset.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: example-opentelemetry-collector
  namespace: default
  labels:
    helm.sh/chart: opentelemetry-collector-0.143.2
    app.kubernetes.io/name: opentelemetry-collector
    app.kubernetes.io/instance: example
    app.kubernetes.io/version: "0.165.0"
    app.kubernetes.io/managed-by: Helm
spec:
  serviceName: example-opentelemetry-collector
  podManagementPolicy: Parallel
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: opentelemetry-collector
      app.kubernetes.io/instance: example
      component: statefulset-collector
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      annotations:
        checksum/config: 17da21931b94e01503163e20295fc5105bd77055e3205eb2a139293119d6a55e
        
      labels:
        app.kubernetes.io/name: opentelemetry-collector
        app.kubernetes.io/instance: example
        component: statefulset-collector
        
    spec:
      
      serviceAccountName: example-opentelemetry-collector
      securityContext:
        {}
      containers:
        - name: opentelemetry-collector
          command:
            - /otelcol-contrib
            - --config=/conf/relay.yaml
          securityContext:
            {}
          image: "ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.165.0"
          imagePullPolicy: IfNotPresent
          ports:
            - name: otlp
              containerPort: 4317
              protocol: TCP
            - name: otlp-http
              containerPort: 4318
              protocol: TCP
          env:
            - name: MY_POD_IP
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: status.podIP
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            
            - name: DBM_ORDERS_USERNAME
              valueFrom:
                secretKeyRef:
                  name: "dbm-orders"
                  key: "username"
            - name: DBM_ORDERS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: "dbm-orders"
                  key: "password"
            - name: DBM_BILLING_USERNAME
              valueFrom:
                secretKeyRef:
                  name: "dbm-billing"
                  key: "user"
            - name: DBM_BILLING_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: "dbm-billing"
                  key: "pass"
            - name: GOMEMLIMIT
              value: "819MiB"
          livenessProbe:
            httpGet:
              path: /
              port: 13133
          readinessProbe:
            httpGet:
              path: /
              port: 13133
          resources:
            limits:
              cpu: 1
              memory: 1Gi
          volumeMounts:
            - mountPath: /conf
              name: opentelemetry-collector-configmap
      volumes:
        - name: opentelemetry-collector-configmap
          configMap:
            name: example-opentelemetry-collector-statefulset
            items:
              - key: relay
                path: relay.yaml
      nodeSelector:
        kubernetes.io/os: linux
      hostNetwork: false
