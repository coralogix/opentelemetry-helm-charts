mode: daemonset

# The control-plane nodes are tainted: tolerate it so an agent also runs there. The preset does not add this itself.
tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule

presets:
  k8sControlPlaneMetrics:
    enabled: true
    scrapeInterval: 30s
    # etcd is opt-in. Plain http on :2381; add `secret` for mTLS on :2379.
    etcd:
      enabled: true
    # NodeLocal DNSCache addon, if installed
    dns:
      nodeLocal:
        enabled: true

config:
  exporters:
    debug:
      verbosity: detailed
  service:
    pipelines:
      metrics:
        exporters:
          - debug

resources:
  limits:
    cpu: 100m
    memory: 200M
