mode: deployment
replicaCount: 1
autoscaling:
  enabled: false
rollout:
  strategy: Recreate
service:
  enabled: false
ports:
  otlp:
    enabled: false
  otlp-http:
    enabled: false

presets:
  otlpReceiver:
    enabled: false
  coralogixExporter:
    enabled: true
    pipelines: [metrics, logs]
    domain: coralogix.com
    defaultApplicationName: db-monitoring
    defaultSubsystemName: postgresql
  dbMonitoring:
    enabled: true
    postgresql:
      - name: orders
        host: orders-db.databases.svc.cluster.local
        username: otel
        auth:
          password: ${env:ORDERS_DB_PASSWORD}
        instanceId: production/databases/orders-db
        databases: [orders, billing]
        tls:
          insecure: true
        resourceAttributes:
          k8s.cluster.name: production
          k8s.namespace.name: databases
          k8s.statefulset.name: orders-db
        querySamples:
          enabled: true
        topQueries:
          enabled: true
        catalog:
          enabled: true
        receivers:
          querySamples:
            collectionInterval: 30s
          topQueries:
            collectionInterval: 5m
          schema:
            collectionInterval: 30m
      - name: inventory
        # Use the RDS endpoint and give the collector's AWS identity rds-db:connect.
        host: inventory.abcdefghijkl.us-east-1.rds.amazonaws.com
        username: inventory_monitor
        auth:
          aws_iam:
            region: us-east-1
        instanceId: production/inventory-db
        connectDatabase: inventory
        rdsLogs:
          enabled: true
        tls:
          ca_file: /etc/rds-certs/global-bundle.pem
        resourceAttributes:
          deployment.environment.name: production
        querySamples:
          enabled: true
        topQueries:
          enabled: true
        # This list replaces the default exclusions for this target.
        excludeUsers: [inventory_monitor, otel, rdsadmin, otel_catalog, schema_migrator]

config:
  exporters:
    debug: null
  service:
    pipelines:
      logs:
        exporters: []
      metrics:
        exporters: []

extraEnvs:
  - name: CORALOGIX_PRIVATE_KEY
    valueFrom:
      secretKeyRef:
        name: coralogix-keys
        key: PRIVATE_KEY
  - name: ORDERS_DB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: db-monitoring
        key: orders-password

# Create this ConfigMap in the collector namespace with the AWS RDS CA bundle.
extraVolumes:
  - name: rds-ca-bundle
    configMap:
      name: rds-ca-bundle
      items:
        - key: global-bundle.pem
          path: global-bundle.pem
extraVolumeMounts:
  - name: rds-ca-bundle
    mountPath: /etc/rds-certs
    readOnly: true
