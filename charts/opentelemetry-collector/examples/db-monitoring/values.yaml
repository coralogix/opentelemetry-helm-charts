mode: deployment
replicaCount: 1
autoscaling:
  enabled: false
rollout:
  strategy: Recreate
service:
  enabled: false
ports:
  otlp:
    enabled: false
  otlp-http:
    enabled: false

presets:
  otlpReceiver:
    enabled: false
  coralogixExporter:
    enabled: true
    pipelines: [metrics, logs]
    domain: coralogix.com
    defaultApplicationName: db-monitoring
    defaultSubsystemName: postgresql
  dbMonitoring:
    enabled: true
    postgresql:
      - name: orders
        host: orders-db.databases.svc.cluster.local
        username: otel
        password: ${env:ORDERS_DB_PASSWORD}
        instanceId: production/databases/orders-db
        databases: [orders, billing]
        tls:
          insecure: true
        resourceAttributes:
          k8s.cluster.name: production
          k8s.namespace.name: databases
          k8s.statefulset.name: orders-db
        querySamples:
          enabled: true
        topQueries:
          enabled: true
        catalog:
          enabled: true
      - name: inventory
        host: inventory-db.example.com
        port: 5433
        username: otel
        password: ${env:INVENTORY_DB_PASSWORD}
        instanceId: production/inventory-db
        connectDatabase: inventory
        resourceAttributes:
          deployment.environment.name: production

config:
  exporters:
    debug: null
  service:
    pipelines:
      logs:
        exporters: []
      metrics:
        exporters: []

extraEnvs:
  - name: CORALOGIX_PRIVATE_KEY
    valueFrom:
      secretKeyRef:
        name: coralogix-keys
        key: PRIVATE_KEY
  - name: ORDERS_DB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: db-monitoring
        key: orders-password
  - name: INVENTORY_DB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: db-monitoring
        key: inventory-password
