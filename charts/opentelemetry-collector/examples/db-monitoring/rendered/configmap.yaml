      sql_query/db_monitoring_postgresql_inventory_health:
        additional_params:
          sslmode: verify-full
          sslrootcert: /etc/rds-certs/global-bundle.pem
        collection_interval: 5m
        database: inventory
        db_auth: aws_iam_db_auth/us-east-1
        driver: postgres
        host: inventory.abcdefghijkl.us-east-1.rds.amazonaws.com
        port: 5432
        queries:
        - metrics:
          - attribute_columns:
            - datname
            description: Transactions since the oldest unfrozen XID (wraparound at 2^31).
            metric_name: postgresql.database.xid_age
            unit: '{transaction}'
            value_column: xid_age
          - attribute_columns:
            - datname
            description: Multixacts since the oldest unfrozen multixact ID (wraparound
              at 2^31).
            metric_name: postgresql.database.multixact_age
            unit: '{multixact}'
            value_column: mxid_age
          sql: SELECT datname, age(datfrozenxid) AS xid_age, mxid_age(datminmxid) AS mxid_age
            FROM pg_database WHERE datallowconn
        - metrics:
          - attribute_columns:
            - slot_name
            - slot_type
            - database
            - active
            metric_name: postgresql.replication_slot.retained_wal
            unit: By
            value_column: retained_bytes
          sql: |
            SELECT slot_name, slot_type, COALESCE(database, '') AS database, active::text AS active,
                   COALESCE(pg_wal_lsn_diff(CASE WHEN pg_is_in_recovery() THEN pg_last_wal_replay_lsn() ELSE pg_current_wal_lsn() END, restart_lsn), 0)::bigint AS retained_bytes
            FROM pg_replication_slots
        - metrics:
          - metric_name: postgresql.wal.size
            unit: By
            value_column: wal_bytes
          sql: SELECT COALESCE(sum(size), 0)::bigint AS wal_bytes, count(*) AS wal_files
            FROM pg_ls_waldir()
        username: inventory_monitor
      sql_query/db_monitoring_postgresql_inventory_tables_inventory:
        additional_params:
          sslmode: verify-full
          sslrootcert: /etc/rds-certs/global-bundle.pem
