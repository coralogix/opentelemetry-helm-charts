---
# Source: opentelemetry-collector/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: example-opentelemetry-collector
  namespace: default
  labels:
    helm.sh/chart: opentelemetry-collector-0.143.9
    app.kubernetes.io/name: opentelemetry-collector
    app.kubernetes.io/instance: example
    app.kubernetes.io/version: "0.165.0"
    app.kubernetes.io/managed-by: Helm
data:
  relay: |
    exporters:
      coralogix:
        application_name: db-monitoring
        application_name_attributes:
        - k8s.namespace.name
        - service.namespace
        domain: coralogix.com
        domain_settings:
          keepalive:
            enabled: true
            permit_without_stream: false
            time: 30s
            timeout: 10s
        logs:
          headers:
            X-Coralogix-Distribution: helm-otel-integration/
        metrics:
          headers:
            X-Coralogix-Distribution: helm-otel-integration/
        private_key: ${env:CORALOGIX_PRIVATE_KEY}
        profiles:
          headers:
            X-Coralogix-Distribution: helm-otel-integration/
            x-coralogix-ingress: otlp/v1.10.0
        sending_queue:
          batch:
            flush_timeout: 250ms
            max_size: 2097152
            min_size: 1048576
            sizer: bytes
          enabled: true
          num_consumers: 20
          queue_size: 209715200
          sizer: bytes
        subsystem_name: postgresql
        subsystem_name_attributes:
        - k8s.deployment.name
        - k8s.statefulset.name
        - k8s.daemonset.name
        - k8s.cronjob.name
        - service.name
        timeout: 30s
        traces:
          headers:
            X-Coralogix-Distribution: helm-otel-integration/
      coralogix/coralogix_db_monitoring_catalog:
        application_name: resource
        application_name_attributes: []
        domain: coralogix.com
        domain_settings:
          keepalive:
            enabled: true
            permit_without_stream: false
            time: 30s
            timeout: 10s
        logs:
          headers:
            X-Coralogix-Distribution: helm-otel-integration/
            x-coralogix-ingress: metadata-as-otlp-logs/v1
        metrics:
          headers:
            X-Coralogix-Distribution: helm-otel-integration/
        private_key: ${env:CORALOGIX_PRIVATE_KEY}
        profiles:
          headers:
            X-Coralogix-Distribution: helm-otel-integration/
            x-coralogix-ingress: otlp/v1.10.0
        sending_queue:
          batch:
            flush_timeout: 250ms
            max_size: 2097152
            min_size: 1048576
            sizer: bytes
          enabled: true
          num_consumers: 20
          queue_size: 209715200
          sizer: bytes
        subsystem_name: catalog
        subsystem_name_attributes: []
        timeout: 30s
        traces:
          headers:
            X-Coralogix-Distribution: helm-otel-integration/
      coralogix/coralogix_db_monitoring_queries:
        application_name: db-monitoring
        application_name_attributes:
        - k8s.namespace.name
        - service.namespace
        domain: coralogix.com
        domain_settings:
          keepalive:
            enabled: true
            permit_without_stream: false
            time: 30s
            timeout: 10s
        logs:
          headers:
            X-Coralogix-Distribution: helm-otel-integration/
        metrics:
          headers:
            X-Coralogix-Distribution: helm-otel-integration/
        private_key: ${env:CORALOGIX_PRIVATE_KEY}
        profiles:
          headers:
            X-Coralogix-Distribution: helm-otel-integration/
            x-coralogix-ingress: otlp/v1.10.0
        sending_queue:
          batch:
            flush_timeout: 250ms
            max_size: 2097152
            min_size: 1048576
            sizer: bytes
          enabled: true
          num_consumers: 20
          queue_size: 209715200
          sizer: bytes
        subsystem_name: postgresql-slow-queries
        subsystem_name_attributes: []
        timeout: 30s
        traces:
          headers:
            X-Coralogix-Distribution: helm-otel-integration/
    extensions:
      aws_iam_db_auth/us-east-1:
        region: us-east-1
      health_check:
        endpoint: ${env:MY_POD_IP}:13133
    processors:
      batch/db_monitoring: {}
      filter/db_monitoring_postgresql_inventory_own_queries:
        error_mode: ignore
        logs:
          log_record:
          - attributes["postgresql.rolname"] == "inventory_monitor"
          - attributes["user.name"] == "inventory_monitor"
          - attributes["postgresql.rolname"] == "otel"
          - attributes["user.name"] == "otel"
          - attributes["postgresql.rolname"] == "rdsadmin"
          - attributes["user.name"] == "rdsadmin"
          - attributes["postgresql.rolname"] == "otel_catalog"
          - attributes["user.name"] == "otel_catalog"
          - attributes["postgresql.rolname"] == "schema_migrator"
          - attributes["user.name"] == "schema_migrator"
      filter/db_monitoring_postgresql_orders_own_queries:
        error_mode: ignore
        logs:
          log_record:
          - attributes["postgresql.rolname"] == "otel"
          - attributes["user.name"] == "otel"
          - attributes["postgresql.rolname"] == "rdsadmin"
          - attributes["user.name"] == "rdsadmin"
          - attributes["postgresql.rolname"] == "otel_catalog"
          - attributes["user.name"] == "otel_catalog"
      filter/db_monitoring_rds_plans:
        error_mode: ignore
        logs:
          log_record:
          - attributes["db.query.plan"] == nil
      memory_limiter:
        check_interval: 5s
        limit_percentage: 80
        spike_limit_percentage: 25
      resource/db_monitoring_postgresql_inventory:
        attributes:
        - action: upsert
          key: cx.db.instance.id
          value: production/inventory-db
        - action: upsert
          key: db.system.name
          value: postgresql
        - action: upsert
          key: deployment.environment.name
          value: production
        - action: upsert
          key: server.address
          value: inventory.abcdefghijkl.us-east-1.rds.amazonaws.com
        - action: upsert
          key: server.port
          value: 5432
      resource/db_monitoring_postgresql_orders:
        attributes:
        - action: upsert
          key: cx.db.instance.id
          value: production/databases/orders-db
        - action: upsert
          key: db.system.name
          value: postgresql
        - action: upsert
          key: k8s.cluster.name
          value: production
        - action: upsert
          key: k8s.namespace.name
          value: databases
        - action: upsert
          key: k8s.statefulset.name
          value: orders-db
        - action: upsert
          key: server.address
          value: orders-db.databases.svc.cluster.local
        - action: upsert
          key: server.port
          value: 5432
      transform/db_monitoring_catalog:
        error_mode: ignore
        log_statements:
        - context: scope
          statements:
          - set(attributes["otel.entity.event_as_log"], true)
        - context: log
          statements:
          - merge_maps(attributes, resource.attributes, "insert")
          - set(attributes["db.namespace"], attributes["datname"]) where attributes["datname"]
            != nil
          - set(time, observed_time) where time_unix_nano == 0
          - set(attributes["otel.entity.event.type"], "entity_state")
          - set(attributes["otel.entity.type"], body)
          - set(attributes["db.catalog.version"], "2")
          - set(attributes["otel.entity.interval"], Milliseconds(Duration("1h")))
          - 'set(attributes["otel.entity.id"], {"db.instance.id": resource.attributes["cx.db.instance.id"]})
            where body == "db.instance"'
          - 'set(attributes["otel.entity.id"], {"db.schema.instance.id": resource.attributes["cx.db.instance.id"],
            "db.namespace": attributes["db.namespace"]}) where body == "db.schema"'
          - set(attributes["db.system.version"], attributes["db_version"]) where body
            == "db.instance"
          - set(attributes["db.role"], attributes["db_role"]) where body == "db.instance"
          - set(attributes["db.start_time"], attributes["db_start_time"]) where body ==
            "db.instance"
          - set(attributes["db.max_connections"], attributes["max_connections"]) where
            body == "db.instance"
          - set(attributes["db.databases"], ParseJSON(attributes["databases"])) where
            body == "db.instance"
          - set(attributes["db.extensions"], ParseJSON(attributes["extensions"])) where
            body == "db.instance"
          - set(attributes["db.replication_slots"], ParseJSON(attributes["replication_slots"]))
            where body == "db.instance"
          - set(attributes["db.settings"], ParseJSON(attributes["settings"])) where body
            == "db.instance"
          - set(attributes["db.schema.database_count"], attributes["database_count"])
            where body == "db.schema"
          - set(attributes["db.schema.variant_count"], attributes["variant_count"]) where
            body == "db.schema"
          - set(attributes["db.schema.hash"], attributes["schema_hash"]) where body ==
            "db.schema"
          - set(attributes["db.schema.variants"], ParseJSON(attributes["schema_variants"]))
            where body == "db.schema"
          - delete_matching_keys(attributes, "^(datname|db_version|db_role|db_start_time|max_connections|databases|extensions|replication_slots|settings|database_count|variant_count|schema_hash|schema_variants)$")
      transform/db_monitoring_postgresql:
        error_mode: ignore
        log_statements:
        - context: resource
          statements:
          - set(attributes["db.namespace"], attributes["postgresql.database.name"]) where
            attributes["postgresql.database.name"] != nil
          - delete_key(attributes, "postgresql.database.name")
        - context: log
          statements:
          - set(attributes["db.event.kind"], event_name) where event_name != nil and event_name
            != ""
          - set(attributes["postgresql.queryid"], attributes["postgresql.query_id"]) where
            attributes["postgresql.query_id"] != nil
          - set(attributes["postgresql.queryid"], String(attributes["query_id"])) where
            attributes["query_id"] != nil and attributes["query_id"] != 0
          - set(attributes["user.name"], attributes["postgresql.rolname"]) where attributes["postgresql.rolname"]
            != nil
          - set(attributes["user.name"], attributes["user"]) where attributes["user"]
            != nil
          - set(attributes["db.namespace"], attributes["dbname"]) where attributes["dbname"]
            != nil
          - set(attributes["postgresql.application_name"], attributes["application_name"])
            where attributes["application_name"] != nil
          - set(attributes["db.response.status_code"], attributes["state_code"]) where
            attributes["state_code"] != nil
          - delete_key(attributes, "postgresql.query_plan") where attributes["postgresql.query_plan"]
            == ""
          - delete_matching_keys(attributes, "^(postgresql\\.query_id|query_id|postgresql\\.rolname|user|dbname|application_name|state_code)$")
        - conditions:
          - resource.attributes["db.system.name"] == "postgresql"
          context: log
          statements:
          - set(attributes["db.query.id"], attributes["postgresql.queryid"]) where attributes["postgresql.queryid"]
            != nil and attributes["postgresql.queryid"] != ""
          - set(attributes["db.query.calls"], attributes["postgresql.calls"]) where attributes["postgresql.calls"]
            != nil
          - set(attributes["db.query.total_duration_ms"], attributes["postgresql.total_exec_time"]
            * 1000.0) where attributes["postgresql.calls"] != nil
          - set(attributes["db.query.rows"], attributes["postgresql.rows"]) where attributes["postgresql.rows"]
            != nil
          - set(attributes["db.query.plan"], attributes["postgresql.query_plan"]) where
            attributes["postgresql.query_plan"] != nil
          - set(attributes["db.query.cache.hit_blocks"], attributes["postgresql.shared_blks_hit"])
            where attributes["postgresql.shared_blks_hit"] != nil
          - set(attributes["db.query.cache.read_blocks"], attributes["postgresql.shared_blks_read"])
            where attributes["postgresql.shared_blks_read"] != nil
          - set(attributes["db.query.temp_blocks"], attributes["postgresql.temp_blks_read"]
            + attributes["postgresql.temp_blks_written"]) where attributes["postgresql.temp_blks_read"]
            != nil and attributes["postgresql.temp_blks_written"] != nil
          - delete_key(attributes, "postgresql.total_exec_time") where attributes["postgresql.calls"]
            != nil
          - delete_matching_keys(attributes, "^postgresql\\.(queryid|calls|rows|query_plan|shared_blks_(hit|read)|temp_blks_(read|written))$")
          - set(attributes["db.session.id"], attributes["postgresql.pid"]) where attributes["postgresql.pid"]
            != nil
          - set(attributes["db.session.state"], attributes["postgresql.state"]) where
            attributes["postgresql.state"] != nil and attributes["postgresql.state"] !=
            ""
          - 'set(attributes["db.session.wait_event"], Concat([attributes["postgresql.wait_event_type"],
            attributes["postgresql.wait_event"]], ": ")) where attributes["postgresql.wait_event_type"]
            != nil and attributes["postgresql.wait_event_type"] != ""'
          - set(attributes["db.session.application"], attributes["postgresql.application_name"])
            where attributes["db.event.kind"] == "db.server.query_sample" and attributes["postgresql.application_name"]
            != nil and attributes["postgresql.application_name"] != ""
          - set(attributes["client.address"], attributes["network.peer.address"]) where
            attributes["network.peer.address"] != nil and attributes["network.peer.address"]
            != ""
          - replace_pattern(attributes["client.address"], "/\\d+$", "") where attributes["client.address"]
            != nil
          - set(attributes["db.session.blocked_by"], attributes["postgresql.blocking.pids"])
            where attributes["postgresql.blocking.pids"] != nil and attributes["postgresql.blocking.pids"]
            != "{}" and attributes["postgresql.blocking.pids"] != ""
          - replace_pattern(attributes["db.session.blocked_by"], "^\\{|\\}$", "") where
            attributes["db.session.blocked_by"] != nil
          - set(attributes["db.query.duration_ms"], attributes["postgresql.total_exec_time"])
            where attributes["db.event.kind"] == "db.server.query_sample" and attributes["postgresql.total_exec_time"]
            != nil
          - delete_matching_keys(attributes, "^postgresql\\.(pid|state|wait_event|wait_event_type|application_name|blocking\\.pids|total_exec_time)$")
            where attributes["db.event.kind"] == "db.server.query_sample"
        metric_statements:
        - context: resource
          statements:
          - set(attributes["db.namespace"], attributes["postgresql.database.name"]) where
            attributes["postgresql.database.name"] != nil
          - set(attributes["db.collection.name"], attributes["postgresql.table.name"])
            where attributes["postgresql.table.name"] != nil
          - delete_matching_keys(attributes, "^postgresql\\.(database|table)\\.name$")
        - context: datapoint
          statements:
          - set(attributes["db.namespace"], attributes["datname"]) where attributes["datname"]
            != nil
          - set(attributes["postgresql.schema.name"], attributes["schemaname"]) where
            attributes["schemaname"] != nil
          - set(attributes["db.collection.name"], attributes["relname"]) where attributes["relname"]
            != nil
          - delete_matching_keys(attributes, "^(datname|schemaname|relname)$")
      transform/db_monitoring_rds_plans:
        error_mode: ignore
        log_statements:
        - context: log
          statements:
          - 'merge_maps(cache, ExtractPatterns(body, "^\\d{4}-\\d\\d-\\d\\d \\d\\d:\\d\\d:\\d\\d(?:\\.\\d+)?
            \\w+:(?P<client>[^()]*?)(?:\\(\\d+\\))?:(?P<user>[^@:]*)@(?P<db>[^:]*):\\[\\d+\\]:(?:\\d+:[0-9A-Z]{5}:\\d{4}-\\d\\d-\\d\\d
            \\d\\d:\\d\\d:\\d\\d \\w+:[^:]*:\\d+:[0-9a-f]+\\.[0-9a-f]+:(?:(?P<app>.*?):)?)?LOG:\\s+duration:
            (?P<duration>[0-9.]+) ms\\s+plan:\\s*(?P<plan>\\{[\\s\\S]*\\})\\s*$"), "upsert")
            where IsString(body)'
          - set(cache["decoded"], ParseJSON(cache["plan"])) where cache["plan"] != nil
          - merge_maps(cache, ExtractPatterns(cache["plan"], "\"Query Identifier\"\\s*:\\s*(?P<queryid>-?[1-9]\\d*)\\s*[,}]"),
            "upsert") where cache["decoded"] != nil and IsMap(cache["decoded"]["Plan"])
            and cache["decoded"]["Query Identifier"] != nil
          - set(cache["decoded"]["Query Identifier"], Int(cache["queryid"])) where cache["queryid"]
            != nil
          - delete_key(cache["decoded"], "Query Text") where cache["queryid"] != nil
          - delete_key(cache["decoded"], "Query Parameters") where cache["queryid"] !=
            nil
          - set(cache["sanitized"], String(cache["decoded"])) where cache["queryid"] !=
            nil and IsInt(cache["decoded"]["Query Identifier"])
          - replace_pattern(cache["sanitized"], "'(?:[^'\"\\\\]|\\\\.|'')*'", "'?'") where
            cache["sanitized"] != nil
          - set(attributes["db.query.plan"], cache["sanitized"]) where cache["sanitized"]
            != nil
          - set(attributes["db.query.id"], cache["queryid"]) where cache["sanitized"]
            != nil
          - set(event_name, "db.server.query_plan") where cache["sanitized"] != nil
          - set(attributes["db.event.kind"], event_name) where cache["sanitized"] != nil
          - set(attributes["db.plan.source"], "auto_explain") where cache["sanitized"]
            != nil
          - set(attributes["db.query.duration_ms"], Double(cache["duration"])) where cache["sanitized"]
            != nil
          - set(attributes["user.name"], cache["user"]) where cache["sanitized"] != nil
          - set(attributes["db.namespace"], cache["db"]) where cache["sanitized"] != nil
          - set(attributes["client.address"], cache["client"]) where cache["sanitized"]
            != nil and cache["client"] != ""
          - set(attributes["postgresql.application_name"], cache["app"]) where cache["sanitized"]
            != nil and cache["app"] != ""
          - set(body, "auto_explain plan") where cache["sanitized"] != nil
      transform/prometheus:
        error_mode: ignore
        metric_statements:
        - context: metric
          statements:
          - replace_pattern(metric.name, "_total$", "") where resource.attributes["service.name"]
            == "opentelemetry-collector"
          - replace_pattern(metric.name, "^otelcol_process_cpu_seconds_seconds$", "otelcol_process_cpu_seconds")
            where resource.attributes["service.name"] == "opentelemetry-collector"
          - replace_pattern(metric.name, "^otelcol_process_runtime_heap_alloc_bytes_bytes$",
            "otelcol_process_runtime_heap_alloc_bytes") where resource.attributes["service.name"]
            == "opentelemetry-collector"
          - replace_pattern(metric.name, "^otelcol_process_runtime_total_alloc_bytes_bytes$",
            "otelcol_process_runtime_total_alloc_bytes") where resource.attributes["service.name"]
            == "opentelemetry-collector"
          - replace_pattern(metric.name, "^otelcol_process_runtime_total_sys_memory_bytes_bytes$",
            "otelcol_process_runtime_total_sys_memory_bytes") where resource.attributes["service.name"]
            == "opentelemetry-collector"
          - replace_pattern(metric.name, "^otelcol_fileconsumer_open_files$", "otelcol_fileconsumer_open_files_ratio")
            where resource.attributes["service.name"] == "opentelemetry-collector"
          - replace_pattern(metric.name, "^otelcol_fileconsumer_reading_files$", "otelcol_fileconsumer_reading_files_ratio")
            where resource.attributes["service.name"] == "opentelemetry-collector"
          - replace_pattern(metric.name, "^otelcol_otelsvc_k8s_ip_lookup_miss$", "otelcol_otelsvc_k8s_ip_lookup_miss_ratio")
            where resource.attributes["service.name"] == "opentelemetry-collector"
          - replace_pattern(metric.name, "^otelcol_otelsvc_k8s_pod_added$", "otelcol_otelsvc_k8s_pod_added_ratio")
            where resource.attributes["service.name"] == "opentelemetry-collector"
          - replace_pattern(metric.name, "^otelcol_otelsvc_k8s_pod_updated$", "otelcol_otelsvc_k8s_pod_updated_ratio")
            where resource.attributes["service.name"] == "opentelemetry-collector"
          - replace_pattern(metric.name, "^otelcol_otelsvc_k8s_pod_deleted$", "otelcol_otelsvc_k8s_pod_deleted_ratio")
            where resource.attributes["service.name"] == "opentelemetry-collector"
          - replace_pattern(metric.name, "^otelcol_processor_memory_limiter_accepted_log_records$",
            "otelcol_processor_accepted_log_records") where resource.attributes["service.name"]
            == "opentelemetry-collector"
          - replace_pattern(metric.name, "^otelcol_processor_memory_limiter_accepted_metric_points$",
            "otelcol_processor_accepted_metric_points") where resource.attributes["service.name"]
            == "opentelemetry-collector"
          - replace_pattern(metric.name, "^otelcol_processor_memory_limiter_accepted_spans$",
            "otelcol_processor_accepted_spans") where resource.attributes["service.name"]
            == "opentelemetry-collector"
          - replace_pattern(metric.name, "^otelcol_processor_memory_limiter_refused_log_records$",
            "otelcol_processor_refused_log_records") where resource.attributes["service.name"]
            == "opentelemetry-collector"
          - replace_pattern(metric.name, "^otelcol_processor_memory_limiter_refused_metric_points$",
            "otelcol_processor_refused_metric_points") where resource.attributes["service.name"]
            == "opentelemetry-collector"
          - replace_pattern(metric.name, "^otelcol_processor_memory_limiter_refused_spans$",
            "otelcol_processor_refused_spans") where resource.attributes["service.name"]
            == "opentelemetry-collector"
          - replace_pattern(metric.name, "^otelcol_processor_filter_spans\\.filtered$",
            "otelcol_processor_filter_spans.filtered_ratio") where resource.attributes["service.name"]
            == "opentelemetry-collector"
        - context: resource
          statements:
          - set(resource.attributes["k8s.pod.ip"], resource.attributes["net.host.name"])
            where resource.attributes["service.name"] == "opentelemetry-collector"
          - delete_key(resource.attributes, "service_name") where resource.attributes["service.name"]
            == "opentelemetry-collector"
        - context: datapoint
          statements:
          - delete_key(datapoint.attributes, "service_name") where resource.attributes["service.name"]
            == "opentelemetry-collector"
          - delete_key(datapoint.attributes, "otel_scope_name") where datapoint.attributes["service.name"]
            == "opentelemetry-collector"
    receivers:
      aws_cloudwatch/db_monitoring_postgresql_inventory_rds_logs:
        logs:
          groups:
            named:
              /aws/rds/instance/inventory/postgresql: {}
          initial_lookback: 1m
          poll_interval: 30s
        region: us-east-1
      postgresql/db_monitoring_postgresql_inventory_metrics:
        collection_interval: 5m
        connect_database: inventory
        databases:
        - inventory
        db_auth: aws_iam_db_auth/us-east-1
        endpoint: inventory.abcdefghijkl.us-east-1.rds.amazonaws.com:5432
        metrics:
          postgresql.blks_hit:
            enabled: true
          postgresql.blks_read:
            enabled: true
          postgresql.database.locks:
            enabled: true
          postgresql.deadlocks:
            enabled: true
          postgresql.query.execution.time:
            enabled: true
          postgresql.sequential_scans:
            enabled: true
          postgresql.temp.io:
            enabled: true
          postgresql.temp_files:
            enabled: true
          postgresql.tup_deleted:
            enabled: true
          postgresql.tup_fetched:
            enabled: true
          postgresql.tup_inserted:
            enabled: true
          postgresql.tup_returned:
            enabled: true
          postgresql.tup_updated:
            enabled: true
          postgresql.wal.delay:
            enabled: true
        resource_attributes:
          db.system.version:
            enabled: true
        tls:
          ca_file: /etc/rds-certs/global-bundle.pem
          insecure: false
          insecure_skip_verify: false
        transport: tcp
        username: inventory_monitor
      postgresql/db_monitoring_postgresql_inventory_queries:
        collection_interval: 5m
        connect_database: inventory
        databases:
        - inventory
        db_auth: aws_iam_db_auth/us-east-1
        endpoint: inventory.abcdefghijkl.us-east-1.rds.amazonaws.com:5432
        events:
          db.server.query_sample:
            enabled: true
          db.server.top_query:
            enabled: true
        query_sample_collection:
          max_rows_per_query: 20
        resource_attributes:
          db.system.version:
            enabled: true
        tls:
          ca_file: /etc/rds-certs/global-bundle.pem
          insecure: false
          insecure_skip_verify: false
        top_query_collection:
          collection_interval: 5m
          max_explain_each_interval: 10
          max_rows_per_query: 200
          top_n_query: 50
        transport: tcp
        username: inventory_monitor
      postgresql/db_monitoring_postgresql_orders_metrics:
        collection_interval: 5m
        connect_database: postgres
        databases:
        - orders
        - billing
        endpoint: orders-db.databases.svc.cluster.local:5432
        metrics:
