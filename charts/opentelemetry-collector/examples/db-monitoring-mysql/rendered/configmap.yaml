---
# Source: opentelemetry-collector/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: example-opentelemetry-collector
  namespace: default
  labels:
    helm.sh/chart: opentelemetry-collector-0.143.10
    app.kubernetes.io/name: opentelemetry-collector
    app.kubernetes.io/instance: example
    app.kubernetes.io/version: "0.165.0"
    app.kubernetes.io/managed-by: Helm
data:
  relay: |
    exporters:
      coralogix:
        application_name: db-monitoring
        application_name_attributes:
        - k8s.namespace.name
        - service.namespace
        domain: coralogix.com
        domain_settings:
          keepalive:
            enabled: true
            permit_without_stream: false
            time: 30s
            timeout: 10s
        logs:
          headers:
            X-Coralogix-Distribution: helm-otel-integration/
        metrics:
          headers:
            X-Coralogix-Distribution: helm-otel-integration/
        private_key: ${env:CORALOGIX_PRIVATE_KEY}
        profiles:
          headers:
            X-Coralogix-Distribution: helm-otel-integration/
            x-coralogix-ingress: otlp/v1.10.0
        sending_queue:
          batch:
            flush_timeout: 250ms
            max_size: 2097152
            min_size: 1048576
            sizer: bytes
          enabled: true
          num_consumers: 20
          queue_size: 209715200
          sizer: bytes
        subsystem_name: ""
        subsystem_name_attributes:
        - k8s.deployment.name
        - k8s.statefulset.name
        - k8s.daemonset.name
        - k8s.cronjob.name
        - service.name
        timeout: 30s
        traces:
          headers:
            X-Coralogix-Distribution: helm-otel-integration/
      coralogix/coralogix_db_monitoring_catalog:
        application_name: resource
        application_name_attributes: []
        domain: coralogix.com
        domain_settings:
          keepalive:
            enabled: true
            permit_without_stream: false
            time: 30s
            timeout: 10s
        logs:
          headers:
            X-Coralogix-Distribution: helm-otel-integration/
            x-coralogix-ingress: metadata-as-otlp-logs/v1
        metrics:
          headers:
            X-Coralogix-Distribution: helm-otel-integration/
        private_key: ${env:CORALOGIX_PRIVATE_KEY}
        profiles:
          headers:
            X-Coralogix-Distribution: helm-otel-integration/
            x-coralogix-ingress: otlp/v1.10.0
        sending_queue:
          batch:
            flush_timeout: 250ms
            max_size: 2097152
            min_size: 1048576
            sizer: bytes
          enabled: true
          num_consumers: 20
          queue_size: 209715200
          sizer: bytes
        subsystem_name: catalog
        subsystem_name_attributes: []
        timeout: 30s
        traces:
          headers:
            X-Coralogix-Distribution: helm-otel-integration/
      coralogix/coralogix_db_monitoring_mysql_metrics:
        application_name: db-monitoring
        application_name_attributes:
        - k8s.namespace.name
        - service.namespace
        domain: coralogix.com
        domain_settings:
          keepalive:
            enabled: true
            permit_without_stream: false
            time: 30s
            timeout: 10s
        logs:
          headers:
            X-Coralogix-Distribution: helm-otel-integration/
        metrics:
          headers:
            X-Coralogix-Distribution: helm-otel-integration/
        private_key: ${env:CORALOGIX_PRIVATE_KEY}
        profiles:
          headers:
            X-Coralogix-Distribution: helm-otel-integration/
            x-coralogix-ingress: otlp/v1.10.0
        sending_queue:
          batch:
            flush_timeout: 250ms
            max_size: 2097152
            min_size: 1048576
            sizer: bytes
          enabled: true
          num_consumers: 20
          queue_size: 209715200
          sizer: bytes
        subsystem_name: mysql
        subsystem_name_attributes: []
        timeout: 30s
        traces:
          headers:
            X-Coralogix-Distribution: helm-otel-integration/
      coralogix/coralogix_db_monitoring_mysql_queries:
        application_name: db-monitoring
        application_name_attributes:
        - k8s.namespace.name
        - service.namespace
        domain: coralogix.com
        domain_settings:
          keepalive:
            enabled: true
            permit_without_stream: false
            time: 30s
            timeout: 10s
        logs:
          headers:
            X-Coralogix-Distribution: helm-otel-integration/
        metrics:
          headers:
            X-Coralogix-Distribution: helm-otel-integration/
        private_key: ${env:CORALOGIX_PRIVATE_KEY}
        profiles:
          headers:
            X-Coralogix-Distribution: helm-otel-integration/
            x-coralogix-ingress: otlp/v1.10.0
        sending_queue:
          batch:
            flush_timeout: 250ms
            max_size: 2097152
            min_size: 1048576
            sizer: bytes
          enabled: true
          num_consumers: 20
          queue_size: 209715200
          sizer: bytes
        subsystem_name: mysql-slow-queries
        subsystem_name_attributes: []
        timeout: 30s
        traces:
          headers:
            X-Coralogix-Distribution: helm-otel-integration/
    extensions:
      aws_iam_db_auth/us-east-1:
        region: us-east-1
      health_check:
        endpoint: ${env:MY_POD_IP}:13133
    processors:
      batch/db_monitoring: {}
      filter/db_monitoring_mysql_inventory-mysql_own_queries:
        error_mode: ignore
        logs:
          log_record:
          - attributes["db.namespace"] == "information_schema"
          - IsString(attributes["db.query.text"]) and IsMatch(attributes["db.query.text"],
            "(?i)^(SHOW (GLOBAL STATUS|REPLICA STATUS|SLAVE STATUS)|SELECT \\? FROM DUAL|USE
            \\S+)$|(performance_schema|information_schema) \\. |thread \\. processlist_id")
          - attributes["user.name"] == "otel"
          - attributes["user.name"] == "otel_catalog"
          - attributes["user.name"] == "rdsadmin"
          - attributes["user.name"] == "schema_migrator"
      filter/db_monitoring_mysql_storefront_own_queries:
        error_mode: ignore
        logs:
          log_record:
          - attributes["db.namespace"] == "information_schema"
          - IsString(attributes["db.query.text"]) and IsMatch(attributes["db.query.text"],
            "(?i)^(SHOW (GLOBAL STATUS|REPLICA STATUS|SLAVE STATUS)|SELECT \\? FROM DUAL|USE
            \\S+)$|(performance_schema|information_schema) \\. |thread \\. processlist_id")
          - attributes["user.name"] == "otel"
          - attributes["user.name"] == "otel_catalog"
          - attributes["user.name"] == "rdsadmin"
      memory_limiter:
        check_interval: 5s
        limit_percentage: 80
        spike_limit_percentage: 25
      resource/db_monitoring_mysql_inventory-mysql:
        attributes:
        - action: upsert
          key: aws.rds.db_instance_identifier
          value: inventory-mysql
        - action: upsert
          key: cloud.account.id
          value: "123456789012"
        - action: upsert
          key: cloud.platform
          value: aws_rds
        - action: upsert
          key: cloud.provider
          value: aws
        - action: upsert
          key: cloud.region
          value: us-east-1
        - action: upsert
          key: cx.db.instance.id
          value: inventory-mysql
        - action: upsert
          key: db.system.name
          value: mysql
        - action: upsert
          key: server.address
          value: inventory-mysql.abcdefghijkl.us-east-1.rds.amazonaws.com
        - action: upsert
          key: server.port
          value: 3306
      resource/db_monitoring_mysql_storefront:
        attributes:
        - action: upsert
          key: cx.db.instance.id
          value: production/databases/storefront-db
        - action: upsert
          key: db.system.name
          value: mysql
        - action: upsert
          key: k8s.cluster.name
          value: production
        - action: upsert
          key: k8s.namespace.name
          value: databases
        - action: upsert
          key: k8s.statefulset.name
          value: storefront-db
        - action: upsert
          key: server.address
          value: storefront-db.databases.svc.cluster.local
        - action: upsert
          key: server.port
          value: 3306
      transform/db_monitoring_mysql:
        error_mode: ignore
        log_statements:
        - context: log
          statements:
          - set(attributes["event.name"], event_name) where event_name != nil and event_name
            != ""
          - set(attributes["trace.id"], trace_id.string) where trace_id.string != "00000000000000000000000000000000"
          - set(attributes["span.id"], span_id.string) where span_id.string != "0000000000000000"
        - context: log
          statements:
          - delete_key(attributes, "db.namespace") where attributes["db.namespace"] ==
            ""
          - delete_key(attributes, "mysql.query_plan") where attributes["mysql.query_plan"]
            == ""
          - set(attributes["db.plan.signature"], SHA256(attributes["mysql.query_plan"]))
            where attributes["mysql.query_plan"] != nil
          - set(attributes["db.response.status_code"], String(attributes["err_code"]))
            where attributes["err_code"] != nil
          - set(attributes["mysql.error.symbol"], attributes["err_symbol"]) where attributes["err_symbol"]
            != nil
          - set(attributes["mysql.sql_state"], attributes["SQL_state"]) where attributes["SQL_state"]
            != nil
          - set(attributes["db.response.status_code"], attributes["errno"]) where attributes["errno"]
            != nil and attributes["errno"] != "0"
          - set(attributes["mysql.query_time"], Double(attributes["query_time"])) where
            attributes["query_time"] != nil
          - set(attributes["mysql.lock_time"], Double(attributes["lock_time"])) where
            attributes["lock_time"] != nil
          - set(attributes["mysql.rows_sent"], Int(attributes["rows_sent"])) where attributes["rows_sent"]
            != nil
          - set(attributes["mysql.rows_examined"], Int(attributes["rows_examined"])) where
            attributes["rows_examined"] != nil
          - set(attributes["client.address"], attributes["client_ip"]) where attributes["client_ip"]
            != nil and attributes["client_ip"] != ""
          - set(attributes["mysql.threads.thread_id"], Int(attributes["thread_id"])) where
            attributes["thread_id"] != nil
          - delete_matching_keys(attributes, "^(err_code|err_symbol|SQL_state|errno|query_time|lock_time|rows_sent|rows_examined|client_ip|client_host|thread_id)$")
          - delete_key(attributes, "client.address") where attributes["client.address"]
            == ""
        metric_statements:
        - context: datapoint
          statements:
          - set(attributes["db.namespace"], attributes["schema"]) where attributes["schema"]
            != nil
          - set(attributes["db.collection.name"], attributes["table"]) where attributes["table"]
            != nil
          - set(attributes["db.index.name"], attributes["index"]) where attributes["index"]
            != nil
          - set(attributes["db.query.id"], attributes["digest"]) where attributes["digest"]
            != nil
          - set(attributes["db.query.text"], attributes["digest_text"]) where attributes["digest_text"]
            != nil
          - set(attributes["mysql.column.name"], attributes["column"]) where attributes["column"]
            != nil
          - set(attributes["mysql.binlog.file.name"], attributes["Log_name"]) where attributes["Log_name"]
            != nil
          - delete_matching_keys(attributes, "^(schema|table|index|digest|digest_text|column|Log_name)$")
      transform/db_monitoring_mysql_catalog:
        error_mode: ignore
        log_statements:
        - context: scope
          statements:
          - set(attributes["otel.entity.event_as_log"], true)
        - context: log
          statements:
          - merge_maps(attributes, resource.attributes, "insert")
          - set(time, observed_time) where time_unix_nano == 0
          - set(attributes["otel.entity.event.type"], "entity_state")
          - set(attributes["otel.entity.type"], body)
          - set(attributes["db.catalog.version"], "2")
          - 'set(attributes["otel.entity.id"], {"db.instance.id": resource.attributes["cx.db.instance.id"]})
            where body == "db.instance"'
          - 'set(attributes["otel.entity.id"], {"db.schema.instance.id": resource.attributes["cx.db.instance.id"]})
            where body == "db.schema"'
          - set(attributes["db.system.version"], attributes["db_version"]) where body
            == "db.instance"
          - set(attributes["db.role"], attributes["db_role"]) where body == "db.instance"
          - set(attributes["db.max_connections"], attributes["max_connections"]) where
            body == "db.instance"
          - set(attributes["db.databases"], ParseJSON(attributes["databases"])) where
            body == "db.instance"
          - set(attributes["db.extensions"], ParseJSON(attributes["extensions"])) where
            body == "db.instance"
          - set(attributes["db.replication_channels"], ParseJSON(attributes["replication_channels"]))
            where body == "db.instance"
          - set(attributes["db.settings"], ParseJSON(attributes["settings"])) where body
            == "db.instance"
          - set(attributes["db.schema.database_count"], attributes["database_count"])
            where body == "db.schema"
          - set(attributes["db.schema.variant_count"], attributes["variant_count"]) where
            body == "db.schema"
          - set(attributes["db.schema.hash"], attributes["schema_hash"]) where body ==
            "db.schema"
          - set(attributes["db.schema.variants"], ParseJSON(attributes["schema_variants"]))
            where body == "db.schema"
          - delete_matching_keys(attributes, "^(db_version|db_role|max_connections|databases|extensions|replication_channels|settings|database_count|variant_count|schema_hash|schema_variants)$")
      transform/db_monitoring_mysql_inventory-mysql_catalog_interval:
        log_statements:
        - context: log
          statements:
          - set(attributes["otel.entity.interval"], Milliseconds(Duration("5m"))) where
            body == "db.instance"
          - set(attributes["otel.entity.interval"], Milliseconds(Duration("5m"))) where
            body == "db.schema"
      transform/db_monitoring_mysql_storefront_catalog_interval:
        log_statements:
        - context: log
          statements:
          - set(attributes["otel.entity.interval"], Milliseconds(Duration("5m"))) where
            body == "db.instance"
          - set(attributes["otel.entity.interval"], Milliseconds(Duration("5m"))) where
            body == "db.schema"
      transform/prometheus:
        error_mode: ignore
        metric_statements:
        - context: metric
          statements:
          - replace_pattern(metric.name, "_total$", "") where resource.attributes["service.name"]
            == "opentelemetry-collector"
          - replace_pattern(metric.name, "^otelcol_process_cpu_seconds_seconds$", "otelcol_process_cpu_seconds")
            where resource.attributes["service.name"] == "opentelemetry-collector"
          - replace_pattern(metric.name, "^otelcol_process_runtime_heap_alloc_bytes_bytes$",
            "otelcol_process_runtime_heap_alloc_bytes") where resource.attributes["service.name"]
            == "opentelemetry-collector"
          - replace_pattern(metric.name, "^otelcol_process_runtime_total_alloc_bytes_bytes$",
            "otelcol_process_runtime_total_alloc_bytes") where resource.attributes["service.name"]
            == "opentelemetry-collector"
          - replace_pattern(metric.name, "^otelcol_process_runtime_total_sys_memory_bytes_bytes$",
            "otelcol_process_runtime_total_sys_memory_bytes") where resource.attributes["service.name"]
            == "opentelemetry-collector"
          - replace_pattern(metric.name, "^otelcol_fileconsumer_open_files$", "otelcol_fileconsumer_open_files_ratio")
            where resource.attributes["service.name"] == "opentelemetry-collector"
          - replace_pattern(metric.name, "^otelcol_fileconsumer_reading_files$", "otelcol_fileconsumer_reading_files_ratio")
            where resource.attributes["service.name"] == "opentelemetry-collector"
          - replace_pattern(metric.name, "^otelcol_otelsvc_k8s_ip_lookup_miss$", "otelcol_otelsvc_k8s_ip_lookup_miss_ratio")
            where resource.attributes["service.name"] == "opentelemetry-collector"
          - replace_pattern(metric.name, "^otelcol_otelsvc_k8s_pod_added$", "otelcol_otelsvc_k8s_pod_added_ratio")
            where resource.attributes["service.name"] == "opentelemetry-collector"
          - replace_pattern(metric.name, "^otelcol_otelsvc_k8s_pod_updated$", "otelcol_otelsvc_k8s_pod_updated_ratio")
            where resource.attributes["service.name"] == "opentelemetry-collector"
          - replace_pattern(metric.name, "^otelcol_otelsvc_k8s_pod_deleted$", "otelcol_otelsvc_k8s_pod_deleted_ratio")
            where resource.attributes["service.name"] == "opentelemetry-collector"
          - replace_pattern(metric.name, "^otelcol_processor_memory_limiter_accepted_log_records$",
            "otelcol_processor_accepted_log_records") where resource.attributes["service.name"]
            == "opentelemetry-collector"
          - replace_pattern(metric.name, "^otelcol_processor_memory_limiter_accepted_metric_points$",
            "otelcol_processor_accepted_metric_points") where resource.attributes["service.name"]
            == "opentelemetry-collector"
          - replace_pattern(metric.name, "^otelcol_processor_memory_limiter_accepted_spans$",
            "otelcol_processor_accepted_spans") where resource.attributes["service.name"]
            == "opentelemetry-collector"
          - replace_pattern(metric.name, "^otelcol_processor_memory_limiter_refused_log_records$",
            "otelcol_processor_refused_log_records") where resource.attributes["service.name"]
            == "opentelemetry-collector"
          - replace_pattern(metric.name, "^otelcol_processor_memory_limiter_refused_metric_points$",
            "otelcol_processor_refused_metric_points") where resource.attributes["service.name"]
            == "opentelemetry-collector"
          - replace_pattern(metric.name, "^otelcol_processor_memory_limiter_refused_spans$",
            "otelcol_processor_refused_spans") where resource.attributes["service.name"]
            == "opentelemetry-collector"
          - replace_pattern(metric.name, "^otelcol_processor_filter_spans\\.filtered$",
            "otelcol_processor_filter_spans.filtered_ratio") where resource.attributes["service.name"]
            == "opentelemetry-collector"
        - context: resource
          statements:
          - set(resource.attributes["k8s.pod.ip"], resource.attributes["net.host.name"])
            where resource.attributes["service.name"] == "opentelemetry-collector"
          - delete_key(resource.attributes, "service_name") where resource.attributes["service.name"]
            == "opentelemetry-collector"
        - context: datapoint
          statements:
          - delete_key(datapoint.attributes, "service_name") where resource.attributes["service.name"]
            == "opentelemetry-collector"
          - delete_key(datapoint.attributes, "otel_scope_name") where datapoint.attributes["service.name"]
            == "opentelemetry-collector"
    receivers:
      mysql/db_monitoring_mysql_inventory-mysql_metrics:
        collection_interval: 60s
        db_auth: aws_iam_db_auth/us-east-1
        endpoint: inventory-mysql.abcdefghijkl.us-east-1.rds.amazonaws.com:3306
        metrics:
          mysql.commands:
            enabled: true
          mysql.connection.count:
            enabled: true
          mysql.connection.errors:
            enabled: true
          mysql.innodb.history_list.length:
            enabled: true
          mysql.innodb.row_lock.wait.count:
            enabled: true
          mysql.innodb.row_lock.wait.duration.avg:
            enabled: true
          mysql.innodb.row_lock.wait.duration.max:
            enabled: true
          mysql.innodb.transaction.active.count:
            enabled: true
          mysql.innodb.transaction.active.duration.max:
            enabled: true
          mysql.joins:
            enabled: true
          mysql.max_used_connections:
            enabled: true
          mysql.query.count:
            enabled: true
          mysql.query.execution.time:
            enabled: true
          mysql.query.slow.count:
            enabled: true
          mysql.replica.sql_delay:
            enabled: true
          mysql.replica.temp_table.open:
            enabled: true
          mysql.replica.thread.running:
            enabled: true
          mysql.replica.time_behind_source:
            enabled: true
          mysql.server.healthy:
            enabled: true
          mysql.session.active.count:
            enabled: true
          mysql.statement_event.count:
            enabled: true
          mysql.statement_event.wait.time:
            enabled: true
          mysql.table.average_row_length:
            enabled: true
          mysql.table.lock_wait.read.count:
            enabled: true
          mysql.table.lock_wait.read.time:
            enabled: true
          mysql.table.lock_wait.write.count:
            enabled: true
          mysql.table.lock_wait.write.time:
            enabled: true
          mysql.table.rows:
            enabled: true
          mysql.table.size:
            enabled: true
        resource_attributes:
          db.system.name:
            enabled: true
          db.system.version:
            enabled: true
        statement_events:
          digest_text_limit: 120
          limit: 250
          time_limit: 24h
        tls:
          ca_file: /etc/rds-certs/global-bundle.pem
          insecure: false
          insecure_skip_verify: false
        transport: tcp
        username: otel
      mysql/db_monitoring_mysql_inventory-mysql_queries:
        collection_interval: 60s
        db_auth: aws_iam_db_auth/us-east-1
        endpoint: inventory-mysql.abcdefghijkl.us-east-1.rds.amazonaws.com:3306
        events:
          db.server.query_plan:
            enabled: false
          db.server.query_sample:
            enabled: true
          db.server.top_query:
            enabled: true
        query_sample_collection:
          max_rows_per_query: 20
        resource_attributes:
          db.system.name:
            enabled: true
          db.system.version:
            enabled: true
        tls:
          ca_file: /etc/rds-certs/global-bundle.pem
          insecure: false
          insecure_skip_verify: false
        top_query_collection:
          collection_interval: 60s
          lookback_time: 360
          max_query_sample_count: 1000
          query_plan_cache_size: 1000
          query_plan_cache_ttl: 1h
          top_query_count: 50
        transport: tcp
        username: otel
      mysql/db_monitoring_mysql_storefront_metrics:
        collection_interval: 60s
        endpoint: storefront-db.databases.svc.cluster.local:3306
        metrics:
          mysql.commands:
            enabled: true
          mysql.connection.count:
            enabled: true
          mysql.connection.errors:
            enabled: true
          mysql.innodb.history_list.length:
            enabled: true
          mysql.innodb.row_lock.wait.count:
            enabled: true
          mysql.innodb.row_lock.wait.duration.avg:
            enabled: true
          mysql.innodb.row_lock.wait.duration.max:
            enabled: true
          mysql.innodb.transaction.active.count:
            enabled: true
          mysql.innodb.transaction.active.duration.max:
            enabled: true
          mysql.joins:
            enabled: true
          mysql.max_used_connections:
            enabled: true
          mysql.query.count:
            enabled: true
          mysql.query.execution.time:
            enabled: true
          mysql.query.slow.count:
            enabled: true
          mysql.replica.sql_delay:
            enabled: true
          mysql.replica.temp_table.open:
            enabled: true
          mysql.replica.thread.running:
            enabled: true
          mysql.replica.time_behind_source:
            enabled: true
          mysql.server.healthy:
            enabled: true
          mysql.session.active.count:
            enabled: true
          mysql.statement_event.count:
            enabled: true
          mysql.statement_event.wait.time:
            enabled: true
          mysql.table.average_row_length:
            enabled: true
          mysql.table.lock_wait.read.count:
            enabled: true
          mysql.table.lock_wait.read.time:
            enabled: true
          mysql.table.lock_wait.write.count:
            enabled: true
          mysql.table.lock_wait.write.time:
            enabled: true
          mysql.table.rows:
            enabled: true
          mysql.table.size:
            enabled: true
        password: ${env:MYSQL_PASSWORD}
        resource_attributes:
          db.system.name:
            enabled: true
          db.system.version:
            enabled: true
        statement_events:
          digest_text_limit: 120
          limit: 250
          time_limit: 24h
        tls:
          insecure: true
          insecure_skip_verify: false
        transport: tcp
        username: otel
      mysql/db_monitoring_mysql_storefront_queries:
        collection_interval: 60s
        endpoint: storefront-db.databases.svc.cluster.local:3306
        events:
          db.server.query_plan:
            enabled: false
          db.server.query_sample:
            enabled: true
          db.server.top_query:
            enabled: true
        password: ${env:MYSQL_PASSWORD}
        query_sample_collection:
          max_rows_per_query: 20
        resource_attributes:
          db.system.name:
            enabled: true
          db.system.version:
            enabled: true
        tls:
          insecure: true
          insecure_skip_verify: false
        top_query_collection:
          collection_interval: 60s
          lookback_time: 360
          max_query_sample_count: 1000
          query_plan_cache_size: 1000
          query_plan_cache_ttl: 1h
          top_query_count: 50
        transport: tcp
        username: otel
      prometheus:
        config:
          scrape_configs:
          - job_name: opentelemetry-collector
            scrape_interval: 30s
            static_configs:
