                         WHEN 'FOREIGN KEY' THEN CONCAT('FOREIGN KEY (', k.cols, ') REFERENCES ', k.ref_table, '(', k.ref_cols, ')',
                                                        IF(rc.UPDATE_RULE = 'NO ACTION', '', CONCAT(' ON UPDATE ', rc.UPDATE_RULE)),
                                                        IF(rc.DELETE_RULE = 'NO ACTION', '', CONCAT(' ON DELETE ', rc.DELETE_RULE)))
                         WHEN 'CHECK' THEN CONCAT('CHECK ', cc.CHECK_CLAUSE) END) ORDER BY tc.CONSTRAINT_NAME), ']') AS j
              FROM information_schema.TABLE_CONSTRAINTS tc JOIN dbs ON dbs.db = tc.CONSTRAINT_SCHEMA
              LEFT JOIN kcu k ON k.db = tc.CONSTRAINT_SCHEMA AND k.name = tc.TABLE_NAME AND k.cname = tc.CONSTRAINT_NAME
              LEFT JOIN information_schema.REFERENTIAL_CONSTRAINTS rc
                ON rc.CONSTRAINT_SCHEMA = tc.CONSTRAINT_SCHEMA AND rc.TABLE_NAME = tc.TABLE_NAME AND rc.CONSTRAINT_NAME = tc.CONSTRAINT_NAME
              LEFT JOIN information_schema.CHECK_CONSTRAINTS cc
                ON cc.CONSTRAINT_SCHEMA = tc.CONSTRAINT_SCHEMA AND cc.CONSTRAINT_NAME = tc.CONSTRAINT_NAME AND tc.CONSTRAINT_TYPE = 'CHECK'
              GROUP BY tc.CONSTRAINT_SCHEMA, tc.TABLE_NAME
            ), tbl AS (
              SELECT t.db, t.name, JSON_OBJECT(
                       'schema', NULL, 'name', t.name,
                       'kind', CASE WHEN t.table_type = 'VIEW' THEN 'view' WHEN parts.n > 0 THEN 'partitioned_table' ELSE 'table' END,
                       'columns', CAST(cols.j AS JSON), 'indexes', CAST(idxs.j AS JSON), 'constraints', CAST(cons.j AS JSON),
                       'partitions', COALESCE(parts.n, 0)) AS j
              FROM t
              LEFT JOIN parts ON parts.db = t.db AND parts.name = t.name
              LEFT JOIN cols ON cols.db = t.db AND cols.name = t.name
              LEFT JOIN idxs ON idxs.db = t.db AND idxs.name = t.name
              LEFT JOIN cons ON cons.db = t.db AND cons.name = t.name
              WHERE t.rn <= 300
            ), per_db AS (
              SELECT dbs.db,
                     CONCAT('[', COALESCE(GROUP_CONCAT(tbl.j ORDER BY tbl.name), ''), ']') AS tables_json,
                     COUNT(tbl.name) AS table_count,
                     (SELECT COUNT(*) FROM t WHERE t.db = dbs.db) > 300 AS truncated
              FROM dbs LEFT JOIN tbl ON tbl.db = dbs.db
              GROUP BY dbs.db
            ), variants AS (
              SELECT MD5(tables_json) AS schema_hash,
                     CONCAT('[', GROUP_CONCAT(JSON_QUOTE(db) ORDER BY db), ']') AS dbs_json,
                     MIN(tables_json) AS tables_json, MAX(table_count) AS table_count, MAX(truncated) AS truncated
              FROM per_db WHERE table_count > 0
              GROUP BY MD5(tables_json)
            )
            SELECT 'db.schema' AS state_kind,
                   CAST((SELECT COUNT(*) FROM per_db) AS CHAR) AS database_count,
                   CAST((SELECT COUNT(*) FROM variants) AS CHAR) AS variant_count,
                   MD5(COALESCE((SELECT GROUP_CONCAT(schema_hash ORDER BY schema_hash) FROM variants), '')) AS schema_hash,
                   (SELECT CONCAT('[', COALESCE(GROUP_CONCAT(JSON_OBJECT(
                             'schema_hash', schema_hash, 'databases', CAST(dbs_json AS JSON), 'table_count', table_count,
                             'truncated', CAST(IF(truncated, 'true', 'false') AS JSON), 'tables', CAST(tables_json AS JSON)) ORDER BY dbs_json), ''), ']')
                    FROM variants) AS schema_variants
        username: otel
      sql_query/db_monitoring_mysql_storefront_tables:
        additional_params:
          group_concat_max_len: 67108864
          information_schema_stats_expiry: 0
          tls: "false"
        collection_interval: 5m
        database: information_schema
        driver: mysql
        host: storefront-db.databases.svc.cluster.local
        password: ${env:MYSQL_PASSWORD}
        port: 3306
        queries:
        - metrics:
          - attribute_columns:
            - schema
            - table
            description: Seconds since InnoDB last recalculated persistent statistics
              (ANALYZE TABLE or auto recalc).
            metric_name: mysql.table.analyze.age
            unit: s
            value_column: analyze_age
          sql: |
            SELECT database_name AS `schema`, table_name AS `table`, TIMESTAMPDIFF(SECOND, last_update, NOW()) AS analyze_age
            FROM mysql.innodb_table_stats
            WHERE database_name NOT IN ('mysql', 'sys')
        username: otel
    service:
      extensions:
      - health_check
      - aws_iam_db_auth/us-east-1
      pipelines:
        logs/db_monitoring_mysql_inventory-mysql_catalog:
          exporters:
          - coralogix/coralogix_db_monitoring_catalog
          processors:
          - memory_limiter
          - resource/db_monitoring_mysql_inventory-mysql
          - transform/db_monitoring_mysql_catalog
          - transform/db_monitoring_mysql_inventory-mysql_catalog_interval
          - batch/db_monitoring
          receivers:
          - sql_query/db_monitoring_mysql_inventory-mysql_details
          - sql_query/db_monitoring_mysql_inventory-mysql_schema
        logs/db_monitoring_mysql_inventory-mysql_queries:
          exporters:
          - coralogix/coralogix_db_monitoring_mysql_queries
          processors:
          - memory_limiter
          - filter/db_monitoring_mysql_inventory-mysql_own_queries
          - resource/db_monitoring_mysql_inventory-mysql
          - transform/db_monitoring_mysql
          - batch/db_monitoring
          receivers:
          - mysql/db_monitoring_mysql_inventory-mysql_queries
        logs/db_monitoring_mysql_storefront_catalog:
          exporters:
          - coralogix/coralogix_db_monitoring_catalog
          processors:
          - memory_limiter
          - resource/db_monitoring_mysql_storefront
          - transform/db_monitoring_mysql_catalog
          - transform/db_monitoring_mysql_storefront_catalog_interval
          - batch/db_monitoring
          receivers:
          - sql_query/db_monitoring_mysql_storefront_details
          - sql_query/db_monitoring_mysql_storefront_schema
        logs/db_monitoring_mysql_storefront_queries:
          exporters:
          - coralogix/coralogix_db_monitoring_mysql_queries
          processors:
          - memory_limiter
          - filter/db_monitoring_mysql_storefront_own_queries
          - resource/db_monitoring_mysql_storefront
          - transform/db_monitoring_mysql
          - batch/db_monitoring
          receivers:
          - mysql/db_monitoring_mysql_storefront_queries
        metrics:
          exporters:
          - coralogix
          processors:
          - memory_limiter
          - transform/prometheus
          receivers:
          - prometheus
        metrics/db_monitoring_mysql_inventory-mysql:
          exporters:
          - coralogix/coralogix_db_monitoring_mysql_metrics
          processors:
          - memory_limiter
          - resource/db_monitoring_mysql_inventory-mysql
          - transform/db_monitoring_mysql
          - batch/db_monitoring
          receivers:
          - mysql/db_monitoring_mysql_inventory-mysql_metrics
          - sql_query/db_monitoring_mysql_inventory-mysql_health
          - sql_query/db_monitoring_mysql_inventory-mysql_tables
        metrics/db_monitoring_mysql_storefront:
          exporters:
          - coralogix/coralogix_db_monitoring_mysql_metrics
          processors:
          - memory_limiter
          - resource/db_monitoring_mysql_storefront
          - transform/db_monitoring_mysql
          - batch/db_monitoring
          receivers:
          - mysql/db_monitoring_mysql_storefront_metrics
          - sql_query/db_monitoring_mysql_storefront_health
          - sql_query/db_monitoring_mysql_storefront_tables
      telemetry:
        logs:
          encoding: json
        metrics:
          readers:
          - pull:
              exporter:
                prometheus:
                  host: ${env:MY_POD_IP}
                  port: 8888
                  without_scope_info: false
                  without_type_suffix: false
                  without_units: false
