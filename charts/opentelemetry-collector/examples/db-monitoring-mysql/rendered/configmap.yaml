      sql_query/db_monitoring_mysql_inventory-mysql_schema:
        additional_params:
          group_concat_max_len: 67108864
          information_schema_stats_expiry: 0
          tls: "true"
        collection_interval: 5m
        database: information_schema
        driver: mysql
        host: inventory-mysql.abcdefghijkl.us-east-1.rds.amazonaws.com
        initial_delay: 30s
        password: ${env:MYSQL_CATALOG_PASSWORD}
        port: 3306
        queries:
        - logs:
          - attribute_columns:
            - database_count
            - variant_count
            - schema_hash
            - schema_variants
            body_column: state_kind
          sql: |
            WITH dbs AS (
              SELECT SCHEMA_NAME AS db FROM information_schema.SCHEMATA
              WHERE SCHEMA_NAME NOT IN ('mysql', 'sys', 'performance_schema', 'information_schema')
            ), t AS (
              SELECT t.TABLE_SCHEMA AS db, t.TABLE_NAME AS name, t.TABLE_TYPE AS table_type,
                     ROW_NUMBER() OVER (PARTITION BY t.TABLE_SCHEMA ORDER BY t.TABLE_NAME) AS rn
              FROM information_schema.TABLES t JOIN dbs ON dbs.db = t.TABLE_SCHEMA
            ), parts AS (
              SELECT p.TABLE_SCHEMA AS db, p.TABLE_NAME AS name, COUNT(*) AS n
              FROM information_schema.PARTITIONS p JOIN dbs ON dbs.db = p.TABLE_SCHEMA
              WHERE p.PARTITION_NAME IS NOT NULL
              GROUP BY p.TABLE_SCHEMA, p.TABLE_NAME
            ), cols AS (
              SELECT c.TABLE_SCHEMA AS db, c.TABLE_NAME AS name,
                     CONCAT('[', GROUP_CONCAT(JSON_OBJECT('name', c.COLUMN_NAME, 'type', c.COLUMN_TYPE,
                                                          'nullable', CAST(IF(c.IS_NULLABLE = 'YES', 'true', 'false') AS JSON),
                                                          'default', c.COLUMN_DEFAULT, 'extra', c.EXTRA) ORDER BY c.ORDINAL_POSITION), ']') AS j
              FROM information_schema.COLUMNS c JOIN dbs ON dbs.db = c.TABLE_SCHEMA
              GROUP BY c.TABLE_SCHEMA, c.TABLE_NAME
            ), idx AS (
              SELECT s.TABLE_SCHEMA AS db, s.TABLE_NAME AS name, s.INDEX_NAME AS index_name,
                     MAX(s.NON_UNIQUE) = 0 AS is_unique, MAX(s.IS_VISIBLE) AS visible,
                     CONCAT('CREATE ', IF(MAX(s.NON_UNIQUE) = 0, 'UNIQUE ', ''), 'INDEX ', s.INDEX_NAME, ' ON ', s.TABLE_NAME, ' USING ', MAX(s.INDEX_TYPE), ' (',
                            GROUP_CONCAT(CONCAT(COALESCE(s.COLUMN_NAME, CONCAT('(', s.EXPRESSION, ')')), IF(s.SUB_PART IS NULL, '', CONCAT('(', s.SUB_PART, ')')),
                                                IF(s.COLLATION = 'D', ' DESC', '')) ORDER BY s.SEQ_IN_INDEX SEPARATOR ', '), ')') AS definition
              FROM information_schema.STATISTICS s JOIN dbs ON dbs.db = s.TABLE_SCHEMA
              GROUP BY s.TABLE_SCHEMA, s.TABLE_NAME, s.INDEX_NAME
            ), idxs AS (
              SELECT db, name,
                     CONCAT('[', GROUP_CONCAT(JSON_OBJECT('name', index_name, 'definition', definition,
                                                          'unique', CAST(IF(is_unique, 'true', 'false') AS JSON),
                                                          'primary', CAST(IF(index_name = 'PRIMARY', 'true', 'false') AS JSON),
                                                          'visible', CAST(IF(visible = 'YES', 'true', 'false') AS JSON)) ORDER BY index_name), ']') AS j
              FROM idx GROUP BY db, name
            ), kcu AS (
              SELECT k.CONSTRAINT_SCHEMA AS db, k.TABLE_NAME AS name, k.CONSTRAINT_NAME AS cname,
                     GROUP_CONCAT(k.COLUMN_NAME ORDER BY k.ORDINAL_POSITION SEPARATOR ', ') AS cols,
                     MAX(IF(k.REFERENCED_TABLE_SCHEMA = k.TABLE_SCHEMA, k.REFERENCED_TABLE_NAME, CONCAT(k.REFERENCED_TABLE_SCHEMA, '.', k.REFERENCED_TABLE_NAME))) AS ref_table,
                     GROUP_CONCAT(k.REFERENCED_COLUMN_NAME ORDER BY k.ORDINAL_POSITION SEPARATOR ', ') AS ref_cols
              FROM information_schema.KEY_COLUMN_USAGE k JOIN dbs ON dbs.db = k.CONSTRAINT_SCHEMA
              GROUP BY k.CONSTRAINT_SCHEMA, k.TABLE_NAME, k.CONSTRAINT_NAME
            ), cons AS (
              SELECT tc.CONSTRAINT_SCHEMA AS db, tc.TABLE_NAME AS name,
                     CONCAT('[', GROUP_CONCAT(JSON_OBJECT(
                       'name', tc.CONSTRAINT_NAME,
                       'type', CASE tc.CONSTRAINT_TYPE WHEN 'PRIMARY KEY' THEN 'p' WHEN 'FOREIGN KEY' THEN 'f' WHEN 'UNIQUE' THEN 'u' WHEN 'CHECK' THEN 'c' END,
                       'definition', CASE tc.CONSTRAINT_TYPE
                         WHEN 'PRIMARY KEY' THEN CONCAT('PRIMARY KEY (', k.cols, ')')
                         WHEN 'UNIQUE' THEN CONCAT('UNIQUE (', k.cols, ')')
                         WHEN 'FOREIGN KEY' THEN CONCAT('FOREIGN KEY (', k.cols, ') REFERENCES ', k.ref_table, '(', k.ref_cols, ')',
                                                        IF(rc.UPDATE_RULE = 'NO ACTION', '', CONCAT(' ON UPDATE ', rc.UPDATE_RULE)),
                                                        IF(rc.DELETE_RULE = 'NO ACTION', '', CONCAT(' ON DELETE ', rc.DELETE_RULE)))
                         WHEN 'CHECK' THEN CONCAT('CHECK ', cc.CHECK_CLAUSE) END) ORDER BY tc.CONSTRAINT_NAME), ']') AS j
              FROM information_schema.TABLE_CONSTRAINTS tc JOIN dbs ON dbs.db = tc.CONSTRAINT_SCHEMA
              LEFT JOIN kcu k ON k.db = tc.CONSTRAINT_SCHEMA AND k.name = tc.TABLE_NAME AND k.cname = tc.CONSTRAINT_NAME
              LEFT JOIN information_schema.REFERENTIAL_CONSTRAINTS rc
                ON rc.CONSTRAINT_SCHEMA = tc.CONSTRAINT_SCHEMA AND rc.TABLE_NAME = tc.TABLE_NAME AND rc.CONSTRAINT_NAME = tc.CONSTRAINT_NAME
              LEFT JOIN information_schema.CHECK_CONSTRAINTS cc
                ON cc.CONSTRAINT_SCHEMA = tc.CONSTRAINT_SCHEMA AND cc.CONSTRAINT_NAME = tc.CONSTRAINT_NAME AND tc.CONSTRAINT_TYPE = 'CHECK'
              GROUP BY tc.CONSTRAINT_SCHEMA, tc.TABLE_NAME
            ), tbl AS (
              SELECT t.db, t.name, JSON_OBJECT(
                       'schema', NULL, 'name', t.name,
                       'kind', CASE WHEN t.table_type = 'VIEW' THEN 'view' WHEN parts.n > 0 THEN 'partitioned_table' ELSE 'table' END,
                       'columns', CAST(cols.j AS JSON), 'indexes', CAST(idxs.j AS JSON), 'constraints', CAST(cons.j AS JSON),
                       'partitions', COALESCE(parts.n, 0)) AS j
              FROM t
              LEFT JOIN parts ON parts.db = t.db AND parts.name = t.name
              LEFT JOIN cols ON cols.db = t.db AND cols.name = t.name
              LEFT JOIN idxs ON idxs.db = t.db AND idxs.name = t.name
              LEFT JOIN cons ON cons.db = t.db AND cons.name = t.name
              WHERE t.rn <= 300
            ), per_db AS (
              SELECT dbs.db,
                     CONCAT('[', COALESCE(GROUP_CONCAT(tbl.j ORDER BY tbl.name), ''), ']') AS tables_json,
                     COUNT(tbl.name) AS table_count,
                     (SELECT COUNT(*) FROM t WHERE t.db = dbs.db) > 300 AS truncated
              FROM dbs LEFT JOIN tbl ON tbl.db = dbs.db
              GROUP BY dbs.db
            ), variants AS (
              SELECT MD5(tables_json) AS schema_hash,
                     CONCAT('[', GROUP_CONCAT(JSON_QUOTE(db) ORDER BY db), ']') AS dbs_json,
                     MIN(tables_json) AS tables_json, MAX(table_count) AS table_count, MAX(truncated) AS truncated
              FROM per_db WHERE table_count > 0
              GROUP BY MD5(tables_json)
            )
            SELECT 'db.schema' AS state_kind,
                   CAST((SELECT COUNT(*) FROM per_db) AS CHAR) AS database_count,
                   CAST((SELECT COUNT(*) FROM variants) AS CHAR) AS variant_count,
                   MD5(COALESCE((SELECT GROUP_CONCAT(schema_hash ORDER BY schema_hash) FROM variants), '')) AS schema_hash,
                   (SELECT CONCAT('[', COALESCE(GROUP_CONCAT(JSON_OBJECT(
                             'schema_hash', schema_hash, 'databases', CAST(dbs_json AS JSON), 'table_count', table_count,
                             'truncated', CAST(IF(truncated, 'true', 'false') AS JSON), 'tables', CAST(tables_json AS JSON)) ORDER BY dbs_json), ''), ']')
                    FROM variants) AS schema_variants
        username: otel_catalog
