---
# Source: opentelemetry-collector/templates/configmap-agent.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: example-opentelemetry-collector-agent
  namespace: default
  labels:
    helm.sh/chart: opentelemetry-collector-0.142.3
    app.kubernetes.io/name: opentelemetry-collector
    app.kubernetes.io/instance: example
    app.kubernetes.io/version: "0.164.0"
    app.kubernetes.io/managed-by: Helm
data:
  relay: |
    connectors:
      forward/compact: {}
      forward/db: {}
      routing:
        default_pipelines:
        - traces/default
        error_mode: ignore
        table:
        - pipelines:
          - traces/0
          statement: route() where attributes["service.name"] == "checkout"
      spanmetrics/0:
        add_resource_attributes: true
        aggregation_cardinality_limit: 100000
        dimensions:
        - name: http.method
        - name: cgx.transaction
        - name: cgx.transaction.root
        - name: status_code
        - name: db.namespace
        - name: db.operation.name
        - name: db.collection.name
        - name: db.system
        - name: graphql.operation.type
        - name: http.response.status_code
        - name: rpc.grpc.status_code
        - name: messaging.system
        - name: messaging.destination.name
        - name: messaging.operation.type
        - name: messaging.consumer.group.name
        histogram:
          explicit:
            buckets:
            - 5ms
            - 10ms
            - 50ms
            - 100ms
            - 500ms
            - 1s
          unit: ms
        metrics_expiration: 0
        metrics_flush_interval: 15s
        namespace: ""
        series_expiration: 5m
      spanmetrics/compact:
        add_resource_attributes: true
        aggregation_cardinality_limit: 100000
        exclude_dimensions:
        - collector.instance.id
        - span.name
        histogram:
          explicit:
            buckets:
            - 1ms
            - 4ms
            - 10ms
            - 20ms
            - 50ms
            - 100ms
            - 200ms
            - 500ms
            - 1s
            - 2s
            - 5s
          unit: ms
        metrics_expiration: 0
        metrics_flush_interval: 15s
        namespace: compact
        series_expiration: 5m
      spanmetrics/db:
        add_resource_attributes: true
        aggregation_cardinality_limit: 100000
        dimensions:
        - name: db.namespace
        - name: db.operation.name
        - name: db.collection.name
        - name: db.system
        exclude_dimensions:
        - collector.instance.id
        histogram:
          explicit:
            buckets:
            - 1ms
            - 4ms
            - 10ms
            - 20ms
            - 50ms
            - 100ms
            - 200ms
            - 500ms
            - 1s
            - 2s
            - 5s
          unit: ms
        metrics_expiration: 0
        metrics_flush_interval: 15s
        namespace: db
        series_expiration: 5m
      spanmetrics/default:
        add_resource_attributes: true
        aggregation_cardinality_limit: 100000
        dimensions:
        - name: http.method
        - name: cgx.transaction
        - name: cgx.transaction.root
        - name: status_code
        - name: db.namespace
        - name: db.operation.name
        - name: db.collection.name
        - name: db.system
        - name: graphql.operation.type
        - name: http.response.status_code
        - name: rpc.grpc.status_code
        - name: messaging.system
        - name: messaging.destination.name
        - name: messaging.operation.type
        - name: messaging.consumer.group.name
        histogram:
          explicit:
            buckets:
            - 1ms
            - 4ms
            - 10ms
            - 20ms
            - 50ms
            - 100ms
            - 200ms
            - 500ms
            - 1s
            - 2s
            - 5s
          unit: ms
        metrics_expiration: 0
        metrics_flush_interval: 15s
        namespace: ""
        series_expiration: 5m
    exporters:
      coralogix:
        application_name: otel
        application_name_attributes:
        - k8s.namespace.name
        - service.namespace
        domain: coralogix.com
        domain_settings:
          keepalive:
            enabled: true
            permit_without_stream: false
            time: 30s
            timeout: 10s
        logs:
          headers:
            X-Coralogix-Distribution: helm-otel-integration/
        metrics:
          headers:
            X-Coralogix-Distribution: helm-otel-integration/
        private_key: ${env:CORALOGIX_PRIVATE_KEY}
        profiles:
          headers:
            X-Coralogix-Distribution: helm-otel-integration/
            x-coralogix-ingress: otlp/v1.10.0
        sending_queue:
          batch:
            flush_timeout: 250ms
            max_size: 2097152
            min_size: 1048576
            sizer: bytes
          enabled: true
          num_consumers: 20
          queue_size: 209715200
          sizer: bytes
        subsystem_name: integration
        subsystem_name_attributes:
        - k8s.deployment.name
        - k8s.statefulset.name
        - k8s.daemonset.name
        - k8s.cronjob.name
        - service.name
        timeout: 30s
        traces:
          headers:
            X-Coralogix-Distribution: helm-otel-integration/
      debug: {}
    extensions:
      health_check:
        endpoint: ${env:MY_POD_IP}:13133
    processors:
      batch:
        send_batch_max_size: 2048
        send_batch_size: 1024
        timeout: 1s
      filter/db_spanmetrics:
        traces:
          span:
          - span.attributes["db.system"] == nil and span.attributes["db.system.name"]
            == nil
      k8sattributes:
        extract:
          metadata:
          - k8s.namespace.name
          - k8s.deployment.name
          - k8s.statefulset.name
          - k8s.daemonset.name
          - k8s.cronjob.name
          - k8s.job.name
          - k8s.node.name
          - k8s.pod.name
          - k8s.pod.uid
          - k8s.pod.start_time
        filter:
          node_from_env_var: K8S_NODE_NAME
        passthrough: false
        pod_association:
        - sources:
          - from: resource_attribute
            name: k8s.pod.ip
        - sources:
          - from: resource_attribute
            name: k8s.pod.uid
        - sources:
          - from: connection
        - sources:
          - from: resource_attribute
            name: k8s.job.name
      memory_limiter:
        check_interval: 5s
        limit_percentage: 80
        spike_limit_percentage: 25
      redaction/spanname:
        allow_all_keys: true
        db_sanitizer: null
        url_sanitizer:
          enabled: true
      resourcedetection/env:
        detectors:
        - system
        - env
        override: false
        system:
          resource_attributes:
            host.id:
              enabled: true
        timeout: 2s
      resourcedetection/region:
        detectors:
        - gcp
        - ec2
        - azure
        - eks
        eks:
          node_from_env_var: K8S_NODE_NAME
        override: true
        timeout: 2s
      transform/compact:
        trace_statements:
        - context: resource
          statements:
          - keep_keys(resource.attributes, ["service.name","service.namespace","cx.cluster.name","k8s.cluster.name","host.name","deployment.environment.name","deployment.environment.type"])
      transform/db:
        error_mode: silent
        trace_statements:
        - context: span
          statements:
          - set(attributes["db.system"], attributes["db.system.name"]) where attributes["db.system.name"]
            != nil and attributes["db.system"] == nil
      transform/prometheus:
        error_mode: ignore
        metric_statements:
        - context: metric
          statements:
          - replace_pattern(metric.name, "_total$", "") where resource.attributes["service.name"]
            == "opentelemetry-collector"
          - replace_pattern(metric.name, "^otelcol_process_cpu_seconds_seconds$", "otelcol_process_cpu_seconds")
            where resource.attributes["service.name"] == "opentelemetry-collector"
          - replace_pattern(metric.name, "^otelcol_process_runtime_heap_alloc_bytes_bytes$",
            "otelcol_process_runtime_heap_alloc_bytes") where resource.attributes["service.name"]
            == "opentelemetry-collector"
          - replace_pattern(metric.name, "^otelcol_process_runtime_total_alloc_bytes_bytes$",
            "otelcol_process_runtime_total_alloc_bytes") where resource.attributes["service.name"]
            == "opentelemetry-collector"
          - replace_pattern(metric.name, "^otelcol_process_runtime_total_sys_memory_bytes_bytes$",
            "otelcol_process_runtime_total_sys_memory_bytes") where resource.attributes["service.name"]
            == "opentelemetry-collector"
          - replace_pattern(metric.name, "^otelcol_fileconsumer_open_files$", "otelcol_fileconsumer_open_files_ratio")
            where resource.attributes["service.name"] == "opentelemetry-collector"
          - replace_pattern(metric.name, "^otelcol_fileconsumer_reading_files$", "otelcol_fileconsumer_reading_files_ratio")
            where resource.attributes["service.name"] == "opentelemetry-collector"
          - replace_pattern(metric.name, "^otelcol_otelsvc_k8s_ip_lookup_miss$", "otelcol_otelsvc_k8s_ip_lookup_miss_ratio")
            where resource.attributes["service.name"] == "opentelemetry-collector"
          - replace_pattern(metric.name, "^otelcol_otelsvc_k8s_pod_added$", "otelcol_otelsvc_k8s_pod_added_ratio")
            where resource.attributes["service.name"] == "opentelemetry-collector"
          - replace_pattern(metric.name, "^otelcol_otelsvc_k8s_pod_updated$", "otelcol_otelsvc_k8s_pod_updated_ratio")
            where resource.attributes["service.name"] == "opentelemetry-collector"
          - replace_pattern(metric.name, "^otelcol_otelsvc_k8s_pod_deleted$", "otelcol_otelsvc_k8s_pod_deleted_ratio")
            where resource.attributes["service.name"] == "opentelemetry-collector"
          - replace_pattern(metric.name, "^otelcol_processor_memory_limiter_accepted_log_records$",
            "otelcol_processor_accepted_log_records") where resource.attributes["service.name"]
            == "opentelemetry-collector"
          - replace_pattern(metric.name, "^otelcol_processor_memory_limiter_accepted_metric_points$",
            "otelcol_processor_accepted_metric_points") where resource.attributes["service.name"]
            == "opentelemetry-collector"
          - replace_pattern(metric.name, "^otelcol_processor_memory_limiter_accepted_spans$",
            "otelcol_processor_accepted_spans") where resource.attributes["service.name"]
            == "opentelemetry-collector"
          - replace_pattern(metric.name, "^otelcol_processor_memory_limiter_refused_log_records$",
            "otelcol_processor_refused_log_records") where resource.attributes["service.name"]
            == "opentelemetry-collector"
          - replace_pattern(metric.name, "^otelcol_processor_memory_limiter_refused_metric_points$",
            "otelcol_processor_refused_metric_points") where resource.attributes["service.name"]
            == "opentelemetry-collector"
          - replace_pattern(metric.name, "^otelcol_processor_memory_limiter_refused_spans$",
            "otelcol_processor_refused_spans") where resource.attributes["service.name"]
            == "opentelemetry-collector"
          - replace_pattern(metric.name, "^otelcol_processor_filter_spans\\.filtered$",
            "otelcol_processor_filter_spans.filtered_ratio") where resource.attributes["service.name"]
            == "opentelemetry-collector"
        - context: resource
          statements:
          - set(resource.attributes["k8s.pod.ip"], resource.attributes["net.host.name"])
            where resource.attributes["service.name"] == "opentelemetry-collector"
          - delete_key(resource.attributes, "service_name") where resource.attributes["service.name"]
            == "opentelemetry-collector"
        - context: datapoint
          statements:
          - delete_key(datapoint.attributes, "service_name") where resource.attributes["service.name"]
            == "opentelemetry-collector"
          - delete_key(datapoint.attributes, "otel_scope_name") where datapoint.attributes["service.name"]
            == "opentelemetry-collector"
      transform/spanmetricsmulti:
        error_mode: silent
        metric_statements:
        - context: datapoint
          statements:
          - set(datapoint.attributes["status.code"], "STATUS_CODE_ERROR") where datapoint.attributes["status.code"]
            == nil and instrumentation_scope.name == "spanmetricsconnector" and datapoint.attributes["otel.status_code"]
            == "ERROR"
          - set(datapoint.attributes["status.code"], "STATUS_CODE_OK") where datapoint.attributes["status.code"]
            == nil and instrumentation_scope.name == "spanmetricsconnector" and datapoint.attributes["otel.status_code"]
            == "OK"
          - set(datapoint.attributes["status.code"], "STATUS_CODE_UNSET") where datapoint.attributes["status.code"]
            == nil and instrumentation_scope.name == "spanmetricsconnector" and (datapoint.attributes["otel.status_code"]
            == "UNSET" or datapoint.attributes["otel.status_code"] == nil)
        trace_statements:
        - context: resource
          statements:
          - set(resource.attributes["service.namespace"], resource.attributes["k8s.namespace.name"])
            where resource.attributes["service.namespace"] == nil and resource.attributes["k8s.namespace.name"]
            != nil
          - set(resource.attributes["cx.cluster.name"], resource.attributes["k8s.cluster.name"])
            where resource.attributes["cx.cluster.name"] == nil and resource.attributes["k8s.cluster.name"]
            != nil
          - set(resource.attributes["cx.cluster.name"], resource.attributes["aws.ecs.cluster.name"])
            where resource.attributes["cx.cluster.name"] == nil and resource.attributes["aws.ecs.cluster.name"]
            != nil
          - set(resource.attributes["cx.cluster.name"], resource.attributes["aws.ecs.cluster.arn"])
            where resource.attributes["cx.cluster.name"] == nil and resource.attributes["aws.ecs.cluster.arn"]
            != nil
          - set(resource.attributes["cx.cluster.name"], "prod-eu-1") where resource.attributes["cx.cluster.name"]
            == nil
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: ${env:MY_POD_IP}:4317
            max_recv_msg_size_mib: 20
          http:
            endpoint: ${env:MY_POD_IP}:4318
      prometheus:
        config:
          scrape_configs:
          - job_name: opentelemetry-collector
            scrape_interval: 30s
            static_configs:
            - targets:
              - ${env:MY_POD_IP}:8888
    service:
      extensions:
      - health_check
      pipelines:
        logs:
          exporters:
          - debug
          - coralogix
          processors:
          - memory_limiter
          - resourcedetection/region
          - resourcedetection/env
          - k8sattributes
          - batch
          receivers:
          - otlp
        metrics:
          exporters:
          - debug
          - coralogix
          processors:
          - memory_limiter
          - resourcedetection/region
          - resourcedetection/env
          - k8sattributes
          - transform/spanmetricsmulti
          - transform/prometheus
          - batch
          receivers:
          - spanmetrics/0
          - spanmetrics/default
          - spanmetrics/db
          - prometheus
          - otlp
        metrics/compact:
          exporters:
          - debug
          processors:
          - memory_limiter
          - transform/spanmetricsmulti
          - batch
          receivers:
          - spanmetrics/compact
        traces:
          exporters:
          - routing
          - forward/db
          - forward/compact
          - coralogix
          processors:
          - memory_limiter
          - resourcedetection/region
          - resourcedetection/env
          - k8sattributes
          - transform/spanmetricsmulti
          - redaction/spanname
          - batch
          receivers:
          - otlp
        traces/0:
          exporters:
          - debug
          - spanmetrics/0
          processors:
          - batch
          receivers:
          - routing
        traces/compact:
          exporters:
          - spanmetrics/compact
          processors:
          - transform/compact
          - batch
          receivers:
          - forward/compact
        traces/db:
          exporters:
          - spanmetrics/db
          processors:
          - filter/db_spanmetrics
          - transform/db
          - batch
          receivers:
          - forward/db
        traces/default:
          exporters:
          - debug
          - spanmetrics/default
          processors:
          - batch
          receivers:
          - routing
      telemetry:
        logs:
          encoding: json
        metrics:
          readers:
          - pull:
              exporter:
                prometheus:
                  host: ${env:MY_POD_IP}
                  port: 8888
                  without_scope_info: false
                  without_type_suffix: false
                  without_units: false
