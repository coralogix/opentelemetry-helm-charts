{{- if not .Values.collectorCRD.generate -}}
{{- if or (eq .Values.mode "statefulset") (and .Values.targetAllocator.enabled (eq .Values.targetAllocator.collectionMode "statefulset")) -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "opentelemetry-collector.fullname" . }}
  namespace: {{ template "opentelemetry-collector.namespace" . }}
  labels:
    {{- include "opentelemetry-collector.labels" . | nindent 4 }}
  {{- if .Values.annotations }}
  annotations:
    {{- range $key, $value := .Values.annotations }}
    {{- printf "%s: %s" $key (tpl $value $ | quote) | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  serviceName: {{ include "opentelemetry-collector.fullname" . }}
  podManagementPolicy: {{ .Values.statefulset.podManagementPolicy }}
{{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
{{- end }}
  selector:
    matchLabels:
      {{- include "opentelemetry-collector.selectorLabels" . | nindent 6 }}
      component: statefulset-collector
      {{- if and .Values.targetAllocator.enabled (eq .Values.targetAllocator.collectionMode "statefulset") }}
      opentelemetry.io/target-allocator-pool: "true"
      {{- end }}
  updateStrategy:
    type: {{ .Values.rollout.strategy }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap-statefulset.yaml") . | sha256sum }}
        {{- include "opentelemetry-collector.podAnnotations" . | nindent 8 }}
      labels:
        {{- include "opentelemetry-collector.selectorLabels" . | nindent 8 }}
        component: statefulset-collector
        {{- if and .Values.targetAllocator.enabled (eq .Values.targetAllocator.collectionMode "statefulset") }}
        opentelemetry.io/target-allocator-pool: "true"
        {{- end }}
        {{- include "opentelemetry-collector.podLabels" . | nindent 8 }}
    spec:
      {{- with .Values.dnsPolicy }}
      dnsPolicy: {{ . }}
      {{- end }}
      {{- with .Values.dnsConfig }}
      dnsConfig:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $podValues := .Values }}
      {{- if and .Values.targetAllocator.enabled (eq .Values.targetAllocator.collectionMode "statefulset") }}
      {{- /* Keep read-only hostPath mounts (for example TLS CAs); drop writable ones that share agent queue storage. */ -}}
      {{- $poolHostPathMounts := list }}
      {{- $droppedHostPathNames := dict }}
      {{- range .Values.extraHostPathMounts }}
        {{- if .readOnly }}
          {{- $poolHostPathMounts = append $poolHostPathMounts . }}
        {{- else }}
          {{- $_ := set $droppedHostPathNames .name true }}
        {{- end }}
      {{- end }}
      {{- $poolInitContainers := list }}
      {{- range .Values.initContainers }}
        {{- $refsDropped := false }}
        {{- range (default (list) .volumeMounts) }}
          {{- if hasKey $droppedHostPathNames .name }}
            {{- $refsDropped = true }}
          {{- end }}
        {{- end }}
        {{- if not $refsDropped }}
          {{- $poolInitContainers = append $poolInitContainers . }}
        {{- end }}
      {{- end }}
      {{- $podValues = mergeOverwrite (deepCopy .Values) (dict "mode" "statefulset" "extraHostPathMounts" $poolHostPathMounts "initContainers" $poolInitContainers) }}
      {{- end }}
      {{- $podCtx := mustMergeOverwrite (deepCopy .) (dict "Values" $podValues "configmapSuffix" "-statefulset" "isAgent" false) }}
      {{- include "opentelemetry-collector.pod" $podCtx | nindent 6 }}
      {{- if not .Values.isWindows }}
      hostNetwork: {{ and .Values.hostNetwork (not (and .Values.targetAllocator.enabled (eq .Values.targetAllocator.collectionMode "statefulset"))) }}
      {{- if .Values.presets.ebpfProfiler.enabled }}
      hostPID: true
      {{- end }}
      {{- end }}
  {{- with .Values.statefulset.volumeClaimTemplates }}
  volumeClaimTemplates:
  {{- toYaml . | nindent 2 }}
  {{- end }}
{{- end }}
{{- end }}
