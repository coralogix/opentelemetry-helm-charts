{{- if not .Values.collectorCRD.generate -}}
{{- if or (eq .Values.mode "statefulset") (and .Values.targetAllocator.enabled (eq .Values.targetAllocator.collectionMode "statefulset")) -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "opentelemetry-collector.fullname" . }}
  namespace: {{ template "opentelemetry-collector.namespace" . }}
  labels:
    {{- include "opentelemetry-collector.labels" . | nindent 4 }}
  {{- if .Values.annotations }}
  annotations:
    {{- range $key, $value := .Values.annotations }}
    {{- printf "%s: %s" $key (tpl $value $ | quote) | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  serviceName: {{ include "opentelemetry-collector.fullname" . }}
  podManagementPolicy: {{ .Values.statefulset.podManagementPolicy }}
{{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
{{- end }}
  selector:
    matchLabels:
      {{- include "opentelemetry-collector.selectorLabels" . | nindent 6 }}
      component: statefulset-collector
      {{- if and .Values.targetAllocator.enabled (eq .Values.targetAllocator.collectionMode "statefulset") }}
      opentelemetry.io/target-allocator-pool: "true"
      {{- end }}
  updateStrategy:
    type: {{ .Values.rollout.strategy }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap-statefulset.yaml") . | sha256sum }}
        {{- include "opentelemetry-collector.podAnnotations" . | nindent 8 }}
      labels:
        {{- include "opentelemetry-collector.selectorLabels" . | nindent 8 }}
        component: statefulset-collector
        {{- if and .Values.targetAllocator.enabled (eq .Values.targetAllocator.collectionMode "statefulset") }}
        opentelemetry.io/target-allocator-pool: "true"
        {{- end }}
        {{- include "opentelemetry-collector.podLabels" . | nindent 8 }}
    spec:
      {{- with .Values.dnsPolicy }}
      dnsPolicy: {{ . }}
      {{- end }}
      {{- with .Values.dnsConfig }}
      dnsConfig:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $podValues := .Values }}
      {{- if and .Values.targetAllocator.enabled (eq .Values.targetAllocator.collectionMode "statefulset") }}
      {{- /* Keep read-only hostPaths; replace writable queue hostPaths with emptyDir so pool pods are isolated. */ -}}
      {{- $poolHostPathMounts := list }}
      {{- $poolExtraVolumeMounts := deepCopy (.Values.extraVolumeMounts | default list) }}
      {{- $presetReadOnlyNames := dict "etcmachineid" true "varlibdbusmachineid" true }}
      {{- $writableMountNames := dict }}
      {{- $readOnlyMountNames := dict }}
      {{- range .Values.extraVolumeMounts }}
        {{- if .readOnly }}
          {{- $_ := set $readOnlyMountNames .name true }}
        {{- else }}
          {{- $_ := set $writableMountNames .name true }}
        {{- end }}
      {{- end }}
      {{- $poolExtraVolumes := list }}
      {{- $isolatedVolumeNames := dict }}
      {{- range .Values.extraVolumes }}
        {{- $pvcReadOnly := and (hasKey . "persistentVolumeClaim") (dig "persistentVolumeClaim" "readOnly" false .) }}
        {{- $hostPathType := dig "hostPath" "type" "" . }}
        {{- $isFileHostPath := and (hasKey . "hostPath") (or (eq $hostPathType "File") (eq $hostPathType "FileOrCreate")) }}
        {{- $isSharedPath := or (hasKey . "hostPath") (hasKey . "persistentVolumeClaim") }}
        {{- $isMixedShared := and $isSharedPath (not $pvcReadOnly) (not $isFileHostPath) (hasKey $readOnlyMountNames .name) (hasKey $writableMountNames .name) }}
        {{- $keepShared := or $pvcReadOnly $isFileHostPath (hasKey $presetReadOnlyNames .name) (and (hasKey $readOnlyMountNames .name) (not (hasKey $writableMountNames .name))) }}
        {{- if $isMixedShared }}
          {{- /* Keep shared RO data; give RW mounts an isolated emptyDir twin. */ -}}
          {{- $poolExtraVolumes = append $poolExtraVolumes . }}
          {{- $isolatedName := printf "%s-pool-data" .name }}
          {{- $_ := set $isolatedVolumeNames .name $isolatedName }}
          {{- $poolExtraVolumes = append $poolExtraVolumes (dict "name" $isolatedName "emptyDir" (dict)) }}
        {{- else if and $isSharedPath (not $keepShared) }}
          {{- /* Isolate writable hostPath/PVC queues from the co-located agent. */ -}}
          {{- $poolExtraVolumes = append $poolExtraVolumes (dict "name" .name "emptyDir" (dict)) }}
        {{- else }}
          {{- $poolExtraVolumes = append $poolExtraVolumes . }}
        {{- end }}
      {{- end }}
      {{- $poolInitContainers := deepCopy (.Values.initContainers | default list) }}
      {{- /* Track isolated vs retained volume+subPath pairs so writers stay aligned with readers. */ -}}
      {{- $isolatedSubpaths := dict }}
      {{- $retainedSubpaths := dict }}
      {{- $volumesWithIsolated := dict }}
      {{- $volumesWithRetained := dict }}
      {{- if $isolatedVolumeNames }}
        {{- $remappedMounts := list }}
        {{- range $poolExtraVolumeMounts }}
          {{- $mountName := .name }}
          {{- if kindIs "string" .name }}
            {{- $mountName = tpl .name $ }}
          {{- end }}
          {{- $mountSubPath := .subPath | default "" }}
          {{- if kindIs "string" $mountSubPath }}
            {{- $mountSubPath = tpl $mountSubPath $ }}
          {{- end }}
          {{- $subKey := printf "%s|%s" $mountName $mountSubPath }}
          {{- if and (hasKey $isolatedVolumeNames $mountName) (not .readOnly) }}
            {{- $mount := deepCopy . }}
            {{- $_ := set $mount "name" (index $isolatedVolumeNames $mountName) }}
            {{- $remappedMounts = append $remappedMounts $mount }}
            {{- $_ := set $isolatedSubpaths $subKey true }}
            {{- $_ := set $volumesWithIsolated $mountName true }}
          {{- else }}
            {{- $remappedMounts = append $remappedMounts . }}
            {{- if hasKey $isolatedVolumeNames $mountName }}
              {{- $_ := set $retainedSubpaths $subKey true }}
              {{- $_ := set $volumesWithRetained $mountName true }}
            {{- end }}
          {{- end }}
        {{- end }}
        {{- $poolExtraVolumeMounts = $remappedMounts }}
      {{- end }}
      {{- /* Freeze resolved init mount names before pool volume reordering changes tpl indices. */ -}}
      {{- $remappedInits := list }}
      {{- range $poolInitContainers }}
        {{- $init := deepCopy . }}
        {{- if hasKey $init "volumeMounts" }}
          {{- $initMounts := list }}
          {{- range $init.volumeMounts }}
            {{- $mountName := .name }}
            {{- if kindIs "string" .name }}
              {{- $mountName = tpl .name $ }}
            {{- end }}
            {{- $mountSubPath := .subPath | default "" }}
            {{- if kindIs "string" $mountSubPath }}
              {{- $mountSubPath = tpl $mountSubPath $ }}
            {{- end }}
            {{- $subKey := printf "%s|%s" $mountName $mountSubPath }}
            {{- if and (eq $mountSubPath "") (hasKey $volumesWithIsolated $mountName) (hasKey $volumesWithRetained $mountName) }}
              {{- fail (printf "[ERROR] targetAllocator.collectionMode: statefulset cannot remap root-mounted init/sidecar writers on mixed volume %q; mount isolated and retained subpaths separately." $mountName) }}
            {{- end }}
            {{- $rootWritesIsolated := and (eq $mountSubPath "") (hasKey $volumesWithIsolated $mountName) (not (hasKey $volumesWithRetained $mountName)) }}
            {{- $mount := deepCopy . }}
            {{- if or (hasKey $isolatedSubpaths $subKey) $rootWritesIsolated }}
              {{- $_ := set $mount "name" (index $isolatedVolumeNames $mountName) }}
            {{- else }}
              {{- $_ := set $mount "name" $mountName }}
            {{- end }}
            {{- if ne $mountSubPath "" }}
              {{- $_ := set $mount "subPath" $mountSubPath }}
            {{- end }}
            {{- $initMounts = append $initMounts $mount }}
          {{- end }}
          {{- $_ := set $init "volumeMounts" $initMounts }}
        {{- end }}
        {{- $remappedInits = append $remappedInits $init }}
      {{- end }}
      {{- $poolInitContainers = $remappedInits }}
      {{- range .Values.extraHostPathMounts }}
        {{- if .readOnly }}
          {{- $poolHostPathMounts = append $poolHostPathMounts . }}
        {{- else }}
          {{- $poolExtraVolumes = append $poolExtraVolumes (dict "name" .name "emptyDir" (dict)) }}
          {{- $mount := dict "name" .name "mountPath" .mountPath }}
          {{- if hasKey . "readOnly" }}
            {{- $_ := set $mount "readOnly" .readOnly }}
          {{- end }}
          {{- $poolExtraVolumeMounts = append $poolExtraVolumeMounts $mount }}
        {{- end }}
      {{- end }}
      {{- $poolPresets := deepCopy .Values.presets }}
      {{- if and .Values.presets.logsCollection.enabled .Values.presets.logsCollection.storeCheckpoints }}
      {{- /* Replace the preset hostPath checkpoint volume with isolated emptyDir storage. */ -}}
      {{- $logsCollection := deepCopy .Values.presets.logsCollection }}
      {{- $_ := set $logsCollection "storeCheckpoints" false }}
      {{- $_ := set $poolPresets "logsCollection" $logsCollection }}
      {{- $poolExtraVolumes = append $poolExtraVolumes (dict "name" "varlibotelcol" "emptyDir" (dict)) }}
      {{- $poolExtraVolumeMounts = append $poolExtraVolumeMounts (dict "name" "varlibotelcol" "mountPath" "/var/lib/otelcol") }}
      {{- end }}
      {{- /* Pool pods must not stamp allocated scrapes with the scraper node's identity. */ -}}
      {{- $poolResourceDetection := deepCopy .Values.presets.resourceDetection }}
      {{- $_ := set $poolResourceDetection "k8sNodeName" (dict "enabled" false) }}
      {{- $poolDetectors := deepCopy ($poolResourceDetection.detectors | default dict) }}
      {{- if kindIs "slice" $poolDetectors.env }}
        {{- $_ := set $poolDetectors "env" (without $poolDetectors.env "k8snode" "system") }}
      {{- else if kindIs "invalid" $poolDetectors.env }}
        {{- $_ := set $poolDetectors "env" (list "env") }}
      {{- end }}
      {{- $_ := set $poolResourceDetection "detectors" $poolDetectors }}
      {{- $_ := set $poolPresets "resourceDetection" $poolResourceDetection }}
      {{- $poolK8sAttrs := deepCopy .Values.presets.kubernetesAttributes }}
      {{- $_ := set $poolK8sAttrs "nodeFilter" (dict "enabled" false) }}
      {{- $_ := set $poolPresets "kubernetesAttributes" $poolK8sAttrs }}
      {{- /* Sidecar hostPorts collide with the per-node agent; drop them from the pool. */ -}}
      {{- $poolExtraContainers := list }}
      {{- range .Values.extraContainers }}
        {{- $container := deepCopy . }}
        {{- if hasKey $container "ports" }}
          {{- $ports := list }}
          {{- range $container.ports }}
            {{- $port := deepCopy . }}
            {{- $_ := unset $port "hostPort" }}
            {{- $ports = append $ports $port }}
          {{- end }}
          {{- $_ := set $container "ports" $ports }}
        {{- end }}
        {{- if hasKey $container "volumeMounts" }}
          {{- $sidecarMounts := list }}
          {{- range $container.volumeMounts }}
            {{- $mountName := .name }}
            {{- if kindIs "string" .name }}
              {{- $mountName = tpl .name $ }}
            {{- end }}
            {{- $mountSubPath := .subPath | default "" }}
            {{- if kindIs "string" $mountSubPath }}
              {{- $mountSubPath = tpl $mountSubPath $ }}
            {{- end }}
            {{- $subKey := printf "%s|%s" $mountName $mountSubPath }}
            {{- if and (eq $mountSubPath "") (hasKey $volumesWithIsolated $mountName) (hasKey $volumesWithRetained $mountName) }}
              {{- fail (printf "[ERROR] targetAllocator.collectionMode: statefulset cannot remap root-mounted init/sidecar writers on mixed volume %q; mount isolated and retained subpaths separately." $mountName) }}
            {{- end }}
            {{- $rootWritesIsolated := and (eq $mountSubPath "") (hasKey $volumesWithIsolated $mountName) (not (hasKey $volumesWithRetained $mountName)) }}
            {{- $mount := deepCopy . }}
            {{- if or (hasKey $isolatedSubpaths $subKey) $rootWritesIsolated }}
              {{- $_ := set $mount "name" (index $isolatedVolumeNames $mountName) }}
            {{- else }}
              {{- $_ := set $mount "name" $mountName }}
            {{- end }}
            {{- if ne $mountSubPath "" }}
              {{- $_ := set $mount "subPath" $mountSubPath }}
            {{- end }}
            {{- $sidecarMounts = append $sidecarMounts $mount }}
          {{- end }}
          {{- $_ := set $container "volumeMounts" $sidecarMounts }}
        {{- end }}
        {{- $poolExtraContainers = append $poolExtraContainers $container }}
      {{- end }}
      {{- /* Agent anti-affinity would keep pool pods Pending beside healthy agents. */ -}}
      {{- $poolAffinity := deepCopy (.Values.affinity | default dict) }}
      {{- if hasKey $poolAffinity "podAntiAffinity" }}
        {{- $_ := unset $poolAffinity "podAntiAffinity" }}
      {{- end }}
      {{- $podValues = mergeOverwrite (deepCopy .Values) (dict "mode" "statefulset" "presets" $poolPresets "extraHostPathMounts" $poolHostPathMounts "extraVolumes" $poolExtraVolumes "extraVolumeMounts" $poolExtraVolumeMounts "initContainers" $poolInitContainers "extraContainers" $poolExtraContainers) }}
      {{- /* Replace affinity wholesale; mergeOverwrite would otherwise keep podAntiAffinity. */ -}}
      {{- $_ := set $podValues "affinity" $poolAffinity }}
      {{- end }}
      {{- /* Replace Values wholesale so stripped affinity/volumes are not re-merged from root. */ -}}
      {{- $podCtx := deepCopy . }}
      {{- $_ := set $podCtx "Values" $podValues }}
      {{- $_ := set $podCtx "configmapSuffix" "-statefulset" }}
      {{- $_ := set $podCtx "isAgent" false }}
      {{- include "opentelemetry-collector.pod" $podCtx | nindent 6 }}
      {{- if not .Values.isWindows }}
      hostNetwork: {{ and .Values.hostNetwork (not (and .Values.targetAllocator.enabled (eq .Values.targetAllocator.collectionMode "statefulset"))) }}
      {{- if .Values.presets.ebpfProfiler.enabled }}
      hostPID: true
      {{- end }}
      {{- end }}
  {{- with .Values.statefulset.volumeClaimTemplates }}
  volumeClaimTemplates:
  {{- toYaml . | nindent 2 }}
  {{- end }}
{{- end }}
{{- end }}
