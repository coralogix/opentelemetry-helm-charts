{{- if and (or (eq .Values.mode "statefulset") (and .Values.targetAllocator.enabled (eq .Values.targetAllocator.collectionMode "statefulset"))) (.Values.configMap.create) -}}
{{- if and .Values.targetAllocator.enabled (eq .Values.targetAllocator.collectionMode "statefulset") .Values.presets.ebpfProfiler.enabled }}
{{- fail "[ERROR] targetAllocator.collectionMode: statefulset does not support presets.ebpfProfiler.enabled: true." }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "opentelemetry-collector.fullname" . }}-statefulset
  namespace: {{ template "opentelemetry-collector.namespace" . }}
  labels:
    {{- include "opentelemetry-collector.labels" . | nindent 4 }}
data:
  relay: |
    {{- $isTargetAllocatorPool := and .Values.targetAllocator.enabled (eq .Values.targetAllocator.collectionMode "statefulset") -}}
    {{- $poolValues := mergeOverwrite (deepCopy .Values) (dict "mode" "statefulset") -}}
    {{- if $isTargetAllocatorPool }}
    {{- /* Evaluate pool presets as StatefulSet mode so node-local filters are not forced. */ -}}
    {{- /* Disable scraper-node enrichment: allocated targets must not inherit the pool pod's node. */ -}}
    {{- $poolResourceDetection := deepCopy .Values.presets.resourceDetection }}
    {{- $_ := set $poolResourceDetection "k8sNodeName" (dict "enabled" false) }}
    {{- $poolDetectors := deepCopy ($poolResourceDetection.detectors | default dict) }}
    {{- if kindIs "slice" $poolDetectors.env }}
      {{- $_ := set $poolDetectors "env" (without $poolDetectors.env "k8snode" "system") }}
    {{- else if kindIs "invalid" $poolDetectors.env }}
      {{- /* Keep env attrs only; drop k8snode/system so allocated scrapes do not inherit the pool host. */ -}}
      {{- $_ := set $poolDetectors "env" (list "env") }}
    {{- end }}
    {{- $_ := set $poolResourceDetection "detectors" $poolDetectors }}
    {{- $poolPresets := mergeOverwrite (deepCopy .Values.presets) (dict "resourceDetection" $poolResourceDetection) }}
    {{- $poolValues = mergeOverwrite $poolValues (dict "presets" $poolPresets) }}
    {{- end }}
    {{- $poolData := mustMergeOverwrite (deepCopy .) (dict "Values" $poolValues "isTargetAllocatorPool" $isTargetAllocatorPool) -}}
    {{- include "opentelemetry-collector.deploymentConfig" $poolData | nindent 4 -}}
{{- end }}
