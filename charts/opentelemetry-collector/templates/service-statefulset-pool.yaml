{{- if and .Values.targetAllocator.enabled (eq .Values.targetAllocator.collectionMode "statefulset") (or (eq (include "opentelemetry-collector.serviceEnabled" .) "true") (.Values.ingress.enabled)) -}}
{{- $poolValues := mergeOverwrite (deepCopy .Values) (dict "mode" "statefulset") -}}
{{- $cleanPorts := dict -}}
{{- range $key, $port := ($poolValues.ports | default dict) }}
  {{- $_ := set $cleanPorts $key (omit (deepCopy $port) "nodePort") }}
{{- end }}
{{- $_ := set $poolValues "ports" $cleanPorts -}}
{{- /* Replace Values wholesale; mustMergeOverwrite would reintroduce nodePort via recursive merge. */ -}}
{{- $poolCtx := deepCopy . -}}
{{- $_ := set $poolCtx "Values" $poolValues -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "opentelemetry-collector.fullname" . }}-statefulset
  namespace: {{ template "opentelemetry-collector.namespace" . }}
  labels:
    {{- include "opentelemetry-collector.labels" . | nindent 4 }}
    component: statefulset-collector
  {{- if .Values.service.annotations }}
  annotations:
    {{- range $key, $value := .Values.service.annotations }}
    {{- printf "%s: %s" $key (tpl $value $ | quote) | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  type: ClusterIP
  {{- $ports := include "opentelemetry-collector.servicePortsConfig" $poolCtx }}
  {{- if $ports }}
  ports:
    {{- $ports | nindent 4}}
  {{- end }}
  selector:
    {{- include "opentelemetry-collector.selectorLabels" . | nindent 4 }}
    component: statefulset-collector
  internalTrafficPolicy: {{ include "opentelemetry-collector.serviceInternalTrafficPolicy" $poolCtx }}
{{- end }}
